name: Extract KAIZEN v1.5.2 into main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-kaizen-v1.5.2-to-main.yml"

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download KAIZEN installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/KAIZEN-Setup-1.5.2.exe \
            "https://github.com/clubbusinesslatam526-glitch/appcbl/releases/download/v1.5.2/KAIZEN-Setup-1.5.2.exe"
          echo "40ce19782ebf4411cce8dd4ee2cdaa54d1887abc336286ecd9886c03db1e0d8d  /tmp/KAIZEN-Setup-1.5.2.exe" | sha256sum -c -

      - name: Extract application files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

          rm -rf /tmp/kaizen-installer /tmp/kaizen-unpacked
          mkdir -p /tmp/kaizen-installer /tmp/kaizen-unpacked
          7z x -y /tmp/KAIZEN-Setup-1.5.2.exe -o/tmp/kaizen-installer >/tmp/7z-installer.log

          APP_ARCHIVE="$(find /tmp/kaizen-installer -type f \( -name 'app-64.7z' -o -name 'app-32.7z' -o -name 'app.7z' \) | head -n 1 || true)"
          if [ -n "$APP_ARCHIVE" ]; then
            7z x -y "$APP_ARCHIVE" -o/tmp/kaizen-unpacked >/tmp/7z-app.log
          else
            cp -a /tmp/kaizen-installer/. /tmp/kaizen-unpacked/
          fi

          APP_DIR="/tmp/kaizen-unpacked/resources/app"
          if [ ! -d "$APP_DIR" ]; then
            echo "No se encontró resources/app en el instalador extraído" >&2
            exit 1
          fi

          rm -rf app runtime-resources
          mkdir -p app runtime-resources
          cp -a "$APP_DIR"/. app/

          [ -f /tmp/kaizen-unpacked/resources/app-update.yml ] && cp /tmp/kaizen-unpacked/resources/app-update.yml runtime-resources/
          [ -d /tmp/kaizen-unpacked/resources/extensionForSecurity ] && cp -a /tmp/kaizen-unpacked/resources/extensionForSecurity runtime-resources/
          [ -d /tmp/kaizen-unpacked/resources/extensionsData ] && cp -a /tmp/kaizen-unpacked/resources/extensionsData runtime-resources/
          [ -d /tmp/kaizen-unpacked/resources/browserProfilesData ] && cp -a /tmp/kaizen-unpacked/resources/browserProfilesData runtime-resources/
          [ -d /tmp/kaizen-unpacked/resources/syncPath ] && cp -a /tmp/kaizen-unpacked/resources/syncPath runtime-resources/

          printf '%s\n' \
            '# KAIZEN 1.5.2 - programa extraído' \
            '' \
            'La carpeta `app/` contiene los archivos reales de `resources/app` extraídos del instalador oficial KAIZEN 1.5.2.' \
            '' \
            'La carpeta `runtime-resources/` contiene recursos auxiliares de la aplicación que no forman parte del runtime pesado de Chromium/Electron.' \
            '' \
            'SHA-256 del instalador de origen: `40ce19782ebf4411cce8dd4ee2cdaa54d1887abc336286ecd9886c03db1e0d8d`.' \
            > KAIZEN-1.5.2.md

          : > EXCLUDED-LARGE-FILES.txt
          while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 95000000 ]; then
              printf '%s\t%s bytes\n' "$f" "$size" >> EXCLUDED-LARGE-FILES.txt
              rm -f "$f"
            fi
          done < <(find app runtime-resources -type f -print0)
          if [ ! -s EXCLUDED-LARGE-FILES.txt ]; then
            rm -f EXCLUDED-LARGE-FILES.txt
          fi

      - name: Commit extracted program to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/extract-kaizen-v1.5.2-to-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add extracted KAIZEN v1.5.2 program files"
          git push origin main
