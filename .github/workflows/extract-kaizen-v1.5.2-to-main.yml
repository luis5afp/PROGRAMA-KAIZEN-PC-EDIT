name: Extract KAIZEN v1.5.2 into main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-kaizen-v1.5.2-to-main.yml"

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download KAIZEN installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/KAIZEN-Setup-1.5.2.exe \
            "https://github.com/clubbusinesslatam526-glitch/appcbl/releases/download/v1.5.2/KAIZEN-Setup-1.5.2.exe"
          echo "40ce19782ebf4411cce8dd4ee2cdaa54d1887abc336286ecd9886c03db1e0d8d  /tmp/KAIZEN-Setup-1.5.2.exe" | sha256sum -c -

      - name: Extract Electron application
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

          rm -rf /tmp/kaizen-installer /tmp/kaizen-unpacked /tmp/kaizen-source
          mkdir -p /tmp/kaizen-installer /tmp/kaizen-unpacked /tmp/kaizen-source

          7z x -y /tmp/KAIZEN-Setup-1.5.2.exe -o/tmp/kaizen-installer >/tmp/7z-installer.log

          APP_ARCHIVE="$(find /tmp/kaizen-installer -type f \( -name 'app-64.7z' -o -name 'app-32.7z' -o -name 'app.7z' \) | head -n 1 || true)"
          if [ -n "$APP_ARCHIVE" ]; then
            7z x -y "$APP_ARCHIVE" -o/tmp/kaizen-unpacked >/tmp/7z-app.log
          else
            cp -a /tmp/kaizen-installer/. /tmp/kaizen-unpacked/
          fi

          ASAR="$(find /tmp/kaizen-unpacked -type f -path '*/resources/app.asar' | head -n 1 || true)"
          if [ -z "$ASAR" ]; then
            ASAR="$(find /tmp/kaizen-installer -type f -path '*/resources/app.asar' | head -n 1 || true)"
          fi
          if [ -z "$ASAR" ]; then
            echo "No se encontró resources/app.asar" >&2
            find /tmp/kaizen-unpacked -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          npx --yes @electron/asar extract "$ASAR" /tmp/kaizen-source

          rm -rf app
          mkdir -p app
          cp -a /tmp/kaizen-source/. app/

          printf '%s\n' \
            '# KAIZEN 1.5.2 - aplicación extraída' \
            '' \
            'Esta carpeta contiene el contenido de `resources/app.asar` extraído del instalador oficial `KAIZEN-Setup-1.5.2.exe`.' \
            '' \
            'SHA-256 del instalador de origen: `40ce19782ebf4411cce8dd4ee2cdaa54d1887abc336286ecd9886c03db1e0d8d`.' \
            '' \
            'Los archivos binarios del runtime de Electron y el instalador de 401 MB no se guardan en Git normal porque GitHub limita cada archivo a 100 MB. El instalador completo permanece disponible en la Release v1.5.2.' \
            > KAIZEN-1.5.2.md

          # Evitar que un único archivo mayor al límite de GitHub haga fallar todo el push.
          : > EXCLUDED-LARGE-FILES.txt
          while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 95000000 ]; then
              printf '%s\t%s bytes\n' "$f" "$size" >> EXCLUDED-LARGE-FILES.txt
              rm -f "$f"
            fi
          done < <(find app -type f -print0)
          if [ ! -s EXCLUDED-LARGE-FILES.txt ]; then
            rm -f EXCLUDED-LARGE-FILES.txt
          fi

      - name: Commit extracted program to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/extract-kaizen-v1.5.2-to-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add extracted KAIZEN v1.5.2 application"
          git push origin main
