name: Normalize KAIZEN v1.5.2 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-kaizen-v1.5.2.yml"

permissions:
  contents: write

jobs:
  normalize-release:
    runs-on: ubuntu-latest
    steps:
      - name: Match original release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.5.2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "1.5.2" \
            --notes "**Full Changelog**: https://github.com/clubbusinesslatam526-glitch/appcbl/commits/v1.5.2"
