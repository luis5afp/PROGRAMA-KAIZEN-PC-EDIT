name: Build KAIZEN 1.5.3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate custom source
        shell: pwsh
        run: |
          node --check app/main.no-updates.js
          node --check app/inspector/connectionCapture.js
          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.3') { throw "Expected app version 1.5.3, got $($pkg.version)" }
          if ($pkg.main -ne 'main.no-updates.js') { throw "Unexpected main entry: $($pkg.main)" }
          $capture = Get-Content app/inspector/connectionCapture.js -Raw
          if ($capture.Contains('Fetch.enable')) { throw 'Active Fetch interception is not allowed' }
          if (-not $capture.Contains('passive-no-network-modification')) { throw 'Passive capture guard missing' }
          Write-Host 'Source validation OK'

      - name: Download and unpack original 1.5.2 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          gh release download v1.5.2 -p 'KAIZEN-Setup-1.5.2.exe' -D work
          New-Item -ItemType Directory -Force work/nsis | Out-Null
          7z x -y work/KAIZEN-Setup-1.5.2.exe '-owork/nsis' | Out-Host
          if (-not (Test-Path 'work/nsis/$PLUGINSDIR/app-64.7z')) { throw 'Original app-64.7z not found' }
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          7z x -y 'work/nsis/$PLUGINSDIR/app-64.7z' '-owork/runtime' | Out-Host
          if (-not (Test-Path 'work/runtime/KAIZEN.exe')) { throw 'KAIZEN.exe missing from original runtime' }
          if (-not (Test-Path 'work/runtime/resources/app')) { throw 'resources/app missing from original runtime' }
          Write-Host 'Original runtime extracted successfully'

      - name: Inject current KAIZEN app and runtime resources
        shell: pwsh
        run: |
          Remove-Item 'work/runtime/resources/app' -Recurse -Force
          New-Item -ItemType Directory -Force 'work/runtime/resources/app' | Out-Null
          Copy-Item 'app/*' 'work/runtime/resources/app/' -Recurse -Force
          if (Test-Path 'runtime-resources') {
            Copy-Item 'runtime-resources/*' 'work/runtime/resources/' -Recurse -Force
          }
          $pkg = Get-Content 'work/runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.3') { throw 'Injected app has wrong version' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Injected app has wrong entrypoint' }
          if (-not (Test-Path 'work/runtime/resources/app/inspector/connectionCapture.js')) { throw 'Inspector missing after injection' }
          Write-Host 'Current app injected into original Electron runtime'

      - name: Prepare electron-builder wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builder | Out-Null
          @'
          {
            "name": "kaizen",
            "version": "1.5.3",
            "description": "KAIZEN PC custom laboratory build",
            "author": "YERSON",
            "license": "MIT"
          }
          '@ | Set-Content builder/package.json -Encoding utf8
          @'
          appId: com.electron.kaizen
          productName: KAIZEN
          electronVersion: 35.0.0
          directories:
            output: ../work/out
          win:
            target:
              - target: nsis
                arch:
                  - x64
            signAndEditExecutable: false
          nsis:
            oneClick: false
            perMachine: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            installerIcon: ../app/assets/installer.ico
            uninstallerIcon: ../app/assets/uninstaller.ico
            artifactName: KAIZEN-Setup-${version}.${ext}
          '@ | Set-Content builder/electron-builder.yml -Encoding utf8

      - name: Build NSIS installer from prepackaged runtime
        shell: pwsh
        run: |
          Push-Location builder
          npm install --no-audit --no-fund --save-dev electron-builder@26.15.7
          npx electron-builder --prepackaged '../work/runtime' --win nsis --x64 --config electron-builder.yml --publish never
          Pop-Location
          Get-ChildItem work/out | Select-Object Name,Length | Format-Table -AutoSize
          if (-not (Test-Path 'work/out/KAIZEN-Setup-1.5.3.exe')) { throw 'Expected installer was not produced' }

      - name: Verify generated installer contains custom app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/verify-nsis | Out-Null
          7z x -y 'work/out/KAIZEN-Setup-1.5.3.exe' '-owork/verify-nsis' | Out-Host
          if (-not (Test-Path 'work/verify-nsis/$PLUGINSDIR/app-64.7z')) { throw 'Generated NSIS payload missing app-64.7z' }
          New-Item -ItemType Directory -Force work/verify-runtime | Out-Null
          7z x -y 'work/verify-nsis/$PLUGINSDIR/app-64.7z' '-owork/verify-runtime' | Out-Host
          $pkg = Get-Content 'work/verify-runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.3') { throw 'Packaged version verification failed' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Packaged entrypoint verification failed' }
          if (-not (Test-Path 'work/verify-runtime/resources/app/inspector/connectionCapture.js')) { throw 'Packaged inspector verification failed' }
          $capture = Get-Content 'work/verify-runtime/resources/app/inspector/connectionCapture.js' -Raw
          if ($capture.Contains('Fetch.enable')) { throw 'Packaged inspector unexpectedly contains active interception' }
          Write-Host 'Installer payload verification OK'

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'work/out/KAIZEN-Setup-1.5.3.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KAIZEN-Setup-1.5.3.exe" | Set-Content 'work/out/KAIZEN-Setup-1.5.3.exe.sha256' -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Remove one-shot build workflow from main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/build-kaizen-1.5.3.yml'
          git commit -m 'chore: remove one-shot KAIZEN 1.5.3 build workflow'
          git push origin HEAD:main

      - name: Publish KAIZEN 1.5.3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v1.5.3 2>$null) { throw 'Release v1.5.3 already exists' }
          gh release create v1.5.3 `
            'work/out/KAIZEN-Setup-1.5.3.exe' `
            'work/out/KAIZEN-Setup-1.5.3.exe.sha256' `
            --target main `
            --title 'KAIZEN 1.5.3' `
            --notes 'KAIZEN PC 1.5.3 custom laboratory build. Includes passive local connection diagnostics and disabled automatic updates. Built from the original 1.5.2 Electron runtime with the current repository app injected and verified.'
