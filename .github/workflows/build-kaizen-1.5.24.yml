name: Build KAIZEN 1.5.24

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-resources:
    runs-on: windows-latest
    outputs:
      profile_count: ${{ steps.inspect.outputs.profile_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Download resources base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work/resources-base | Out-Null
          gh release download resources-base-v1 -p 'resources.zip' -D work/resources-base
          $zip = Get-Item 'work/resources-base/resources.zip'
          if ($zip.Length -ne 425387589) { throw "Unexpected resources.zip size: $($zip.Length)" }
          Write-Host "resources.zip bytes=$($zip.Length)"
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RESOURCES_SHA256=$hash"

      - name: Inspect resources base
        id: inspect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/resources-extracted | Out-Null
          7z x -y 'work/resources-base/resources.zip' '-owork/resources-extracted' | Out-Host

          $profileRoots = @(
            Get-ChildItem 'work/resources-extracted' -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ieq 'browserProfilesData' -or $_.Name -ieq 'browserProfileData' }
          )
          if (-not $profileRoots.Count) {
            Write-Host 'Top extracted directories:'
            Get-ChildItem 'work/resources-extracted' -Recurse -Directory -ErrorAction SilentlyContinue |
              Select-Object -First 200 -ExpandProperty FullName | Out-Host
            throw 'resources.zip does not contain browserProfilesData/browserProfileData'
          }

          $best = $profileRoots |
            Sort-Object @{Expression={ (Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue).Count };Descending=$true} |
            Select-Object -First 1

          $profiles = @(Get-ChildItem $best.FullName -Directory -ErrorAction Stop |
            Where-Object { -not $_.Name.StartsWith('.kaizen-') })
          if (-not $profiles.Count) { throw "No profile folders found under $($best.FullName)" }

          Write-Host "PROFILE_ROOT=$($best.FullName)"
          Write-Host "PROFILE_COUNT=$($profiles.Count)"
          $profiles | Select-Object -ExpandProperty Name | Out-Host
          "profile_count=$($profiles.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $extRoots = @(
            Get-ChildItem 'work/resources-extracted' -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ieq 'extensionsData' }
          )
          if ($extRoots.Count) {
            Write-Host "EXTENSIONS_ROOT=$($extRoots[0].FullName)"
          } else {
            Write-Host 'No extensionsData folder found; continuing with profiles only.'
          }

  build-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-resources
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate stable installed-only source
        shell: pwsh
        run: |
          node --check app/main.no-updates.js
          node --check app/main.min.js
          node --check app/preload.min.js
          node --check app/util.min.js
          node --check app/proxyServer.js
          node app/tests/family-reliability-scenarios.js
          node app/tests/sync-profile-preload-scenarios.js
          node app/tests/profile-open-fast-path-scenarios.js
          node app/tests/guest-local-update-scenarios.js

          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.24') { throw "Expected 1.5.24, got $($pkg.version)" }
          if ($pkg.main -ne 'main.no-updates.js') { throw "Wrong entrypoint: $($pkg.main)" }

          $main = Get-Content app/main.min.js -Raw
          $preload = Get-Content app/preload.min.js -Raw
          $noUpdates = Get-Content app/main.no-updates.js -Raw

          if (-not $main.Contains('guestListInstalledProfiles')) { throw 'Installed-only profile listing missing' }
          if (-not $main.Contains("ipcMain.handle('guest-installed-profiles'")) { throw 'Installed-only IPC missing' }
          if (-not $main.Contains("ipcMain.handle('guest-installed-folder-open'")) { throw 'Installed folder IPC missing' }
          if (-not $preload.Contains('👤 Modo invitado · perfiles cargados')) { throw 'Stable guest UI missing' }
          if ($preload.Contains('📦 Importar resources.zip')) { throw 'ZIP import must not be exposed' }
          if ($preload.Contains('📂 Importar carpeta')) { throw 'Folder import must not be exposed' }
          if ($preload.Contains('🔄 Actualizar todo')) { throw 'Bulk update must not be exposed' }
          if (-not $main.Contains('KAIZEN-Logistica')) { throw 'Persistent profile root missing' }
          if (-not $noUpdates.Contains('autoUpdater.checkForUpdates = async () => null')) { throw 'Application updater must remain disabled' }
          if (-not $noUpdates.Contains('autoUpdater.downloadUpdate = async () => []')) { throw 'Application updater download must remain disabled' }

      - name: Download and unpack 1.5.23 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          gh release download v1.5.23 -p 'KAIZEN-Setup-1.5.23.exe' -D work
          New-Item -ItemType Directory -Force work/nsis | Out-Null
          7z x -y work/KAIZEN-Setup-1.5.23.exe '-owork/nsis' | Out-Host
          if (-not (Test-Path 'work/nsis/$PLUGINSDIR/app-64.7z')) { throw 'Base app-64.7z not found' }
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          7z x -y 'work/nsis/$PLUGINSDIR/app-64.7z' '-owork/runtime' | Out-Host
          if (-not (Test-Path 'work/runtime/KAIZEN.exe')) { throw 'KAIZEN.exe missing from base runtime' }
          if (-not (Test-Path 'work/runtime/resources/app')) { throw 'resources/app missing from base runtime' }

      - name: Download and embed resources base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work/resources-base | Out-Null
          gh release download resources-base-v1 -p 'resources.zip' -D work/resources-base
          $zip = Get-Item 'work/resources-base/resources.zip'
          if ($zip.Length -ne 425387589) { throw "Unexpected resources.zip size: $($zip.Length)" }

          New-Item -ItemType Directory -Force work/resources-extracted | Out-Null
          7z x -y 'work/resources-base/resources.zip' '-owork/resources-extracted' | Out-Host

          $profileRoots = @(
            Get-ChildItem 'work/resources-extracted' -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ieq 'browserProfilesData' -or $_.Name -ieq 'browserProfileData' }
          )
          if (-not $profileRoots.Count) { throw 'resources.zip does not contain browserProfilesData/browserProfileData' }
          $profileRoot = $profileRoots |
            Sort-Object @{Expression={ (Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue).Count };Descending=$true} |
            Select-Object -First 1

          $profileCount = @(Get-ChildItem $profileRoot.FullName -Directory -ErrorAction Stop |
            Where-Object { -not $_.Name.StartsWith('.kaizen-') }).Count
          if ($profileCount -lt 1) { throw 'No bundled profiles found' }

          $targetProfiles = 'work/runtime/resources/browserProfilesData'
          if (Test-Path $targetProfiles) { Remove-Item $targetProfiles -Recurse -Force }
          New-Item -ItemType Directory -Force $targetProfiles | Out-Null
          Copy-Item (Join-Path $profileRoot.FullName '*') $targetProfiles -Recurse -Force

          $extRoots = @(
            Get-ChildItem 'work/resources-extracted' -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ieq 'extensionsData' }
          )
          if ($extRoots.Count) {
            $targetExtensions = 'work/runtime/resources/extensionsData'
            if (Test-Path $targetExtensions) { Remove-Item $targetExtensions -Recurse -Force }
            New-Item -ItemType Directory -Force $targetExtensions | Out-Null
            Copy-Item (Join-Path $extRoots[0].FullName '*') $targetExtensions -Recurse -Force
          }

          $embedded = @(Get-ChildItem $targetProfiles -Directory -ErrorAction Stop).Count
          if ($embedded -ne $profileCount) { throw "Embedded profile count mismatch: $embedded vs $profileCount" }
          Write-Host "Embedded $embedded profile(s) from resources-base-v1"

      - name: Inject KAIZEN 1.5.24 app
        shell: pwsh
        run: |
          Remove-Item 'work/runtime/resources/app' -Recurse -Force
          New-Item -ItemType Directory -Force 'work/runtime/resources/app' | Out-Null
          Copy-Item 'app/*' 'work/runtime/resources/app/' -Recurse -Force
          if (Test-Path 'runtime-resources') {
            Copy-Item 'runtime-resources/*' 'work/runtime/resources/' -Recurse -Force
          }

          $pkg = Get-Content 'work/runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.24') { throw 'Injected app has wrong version' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Injected app has wrong entrypoint' }

      - name: Prepare electron-builder wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builder | Out-Null
          @'
          {
            "name": "kaizen",
            "version": "1.5.24",
            "description": "KAIZEN PC custom logistics build",
            "author": "YERSON",
            "license": "MIT"
          }
          '@ | Set-Content builder/package.json -Encoding utf8

          @'
          appId: com.electron.kaizen
          productName: KAIZEN
          electronVersion: 35.0.0
          directories:
            output: ../work/out
          win:
            target:
              - target: nsis
                arch:
                  - x64
            signAndEditExecutable: false
          nsis:
            oneClick: false
            perMachine: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            installerIcon: ../app/assets/installer.ico
            uninstallerIcon: ../app/assets/uninstaller.ico
            artifactName: KAIZEN-Setup-${version}.${ext}
          '@ | Set-Content builder/electron-builder.yml -Encoding utf8

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Push-Location builder
          npm install --no-audit --no-fund --save-dev electron-builder@26.15.7
          npx electron-builder --prepackaged '../work/runtime' --win nsis --x64 --config electron-builder.yml --publish never
          Pop-Location
          if (-not (Test-Path 'work/out/KAIZEN-Setup-1.5.24.exe')) { throw 'Expected installer was not produced' }

      - name: Verify generated installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/verify-nsis | Out-Null
          7z x -y 'work/out/KAIZEN-Setup-1.5.24.exe' '-owork/verify-nsis' | Out-Host
          if (-not (Test-Path 'work/verify-nsis/$PLUGINSDIR/app-64.7z')) { throw 'Generated NSIS payload missing app-64.7z' }

          New-Item -ItemType Directory -Force work/verify-runtime | Out-Null
          7z x -y 'work/verify-nsis/$PLUGINSDIR/app-64.7z' '-owork/verify-runtime' | Out-Host
          $appRoot = 'work/verify-runtime/resources/app'
          $profilesRoot = 'work/verify-runtime/resources/browserProfilesData'

          $pkg = Get-Content "$appRoot/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.24') { throw 'Packaged version verification failed' }
          if (-not (Test-Path $profilesRoot)) { throw 'Packaged browserProfilesData missing' }

          $profiles = @(Get-ChildItem $profilesRoot -Directory -ErrorAction Stop)
          if ($profiles.Count -lt 1) { throw 'Packaged browserProfilesData is empty' }
          Write-Host "Packaged profiles: $($profiles.Count)"
          $profiles | Select-Object -ExpandProperty Name | Out-Host

          node --check "$appRoot/main.no-updates.js"
          node --check "$appRoot/main.min.js"
          node --check "$appRoot/preload.min.js"

          $main = Get-Content "$appRoot/main.min.js" -Raw
          $preload = Get-Content "$appRoot/preload.min.js" -Raw
          if (-not $main.Contains('guestListInstalledProfiles')) { throw 'Packaged installed-only listing missing' }
          if (-not $preload.Contains('👤 Modo invitado · perfiles cargados')) { throw 'Packaged stable guest UI missing' }
          if ($preload.Contains('📦 Importar resources.zip')) { throw 'Packaged ZIP import unexpectedly exposed' }
          if ($preload.Contains('🔄 Actualizar todo')) { throw 'Packaged bulk update unexpectedly exposed' }

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'work/out/KAIZEN-Setup-1.5.24.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KAIZEN-Setup-1.5.24.exe" | Set-Content 'work/out/KAIZEN-Setup-1.5.24.exe.sha256' -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Publish KAIZEN 1.5.24 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v1.5.24 2>$null) { throw 'Release v1.5.24 already exists' }
          gh release create v1.5.24 `
            'work/out/KAIZEN-Setup-1.5.24.exe' `
            'work/out/KAIZEN-Setup-1.5.24.exe.sha256' `
            --target main `
            --title 'KAIZEN 1.5.24' `
            --notes 'KAIZEN PC 1.5.24 integra los perfiles del paquete resources-base-v1 directamente dentro del instalador. El modo Invitado muestra solo perfiles ya cargados físicamente, sin importar ZIP, sin importar carpetas y sin Actualizar todo. En el primer arranque los perfiles empaquetados se migran al almacenamiento persistente KAIZEN-Logistica. El modo Invitado continúa sin login/token y el actualizador de la aplicación permanece desactivado.'

      - name: Remove one-shot build workflow
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/build-kaizen-1.5.24.yml'
          git commit -m 'build: remove KAIZEN 1.5.24 one-shot workflow'
          git push origin HEAD:main
