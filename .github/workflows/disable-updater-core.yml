name: Disable KAIZEN updater core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-updater-core.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove updater initialization and active handlers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/main.min.js')
          s = p.read_text(encoding='utf-8')
          original = s

          # Disable any deferred installer path and completely empty the updater setup
          # (this removes the startup check and the 6-hour setInterval check from executable code).
          pattern = r"function attemptAutoInstall\(\)\{.*?\}function setupAutoUpdates\(\)\{.*?\}ipcMain"
          s, count = re.subn(
              pattern,
              "function attemptAutoInstall(){return;}function setupAutoUpdates(){return;}ipcMain",
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected to replace updater functions once, got {count}')

          old_state = "let updateState={'state':_0x305491(0x27a)};"
          if old_state not in s:
              raise SystemExit('updateState initializer not found')
          s = s.replace(old_state, "let updateState={'state':'disabled'};", 1)

          old_manual_check = "ipcMain[_0x305491(0x182)](_0x305491(0x208),()=>autoUpdater[_0x305491(0x1e7)]()[_0x305491(0x16e)](_0x2d563c=>console[_0x305491(0x1c2)](_0x305491(0x1fe),_0x2d563c))),"
          if old_manual_check not in s:
              raise SystemExit('manual update-check handler not found')
          s = s.replace(
              old_manual_check,
              "ipcMain[_0x305491(0x182)](_0x305491(0x208),()=>({'disabled':!![]})),",
              1,
          )

          old_install = "ipcMain['handle']('update-install',()=>{setImmediate(()=>autoUpdater['quitAndInstall'](![]));}),"
          if old_install not in s:
              raise SystemExit('update-install handler not found')
          s = s.replace(
              old_install,
              "ipcMain['handle']('update-install',()=>({'disabled':!![]})),",
              1,
          )

          old_ready = "app['on'](_0x305491(0x1e3),async()=>{await createWindow();if(mainWindow)setupAutoUpdates();}),"
          if old_ready not in s:
              raise SystemExit('ready updater initialization not found')
          s = s.replace(
              old_ready,
              "app['on'](_0x305491(0x1e3),async()=>{await createWindow();}),",
              1,
          )

          if s == original:
              raise SystemExit('No changes made')
          if 'setupAutoUpdates();' in s:
              raise SystemExit('An active setupAutoUpdates() call still exists')
          if "autoUpdater[_0x305491(0x1e7)]()" in s:
              raise SystemExit('An active checkForUpdates call still exists')
          if "autoUpdater['quitAndInstall']" in s:
              raise SystemExit('An active quitAndInstall call still exists')

          p.write_text(s, encoding='utf-8')
          print('Updater core disabled successfully.')
          PY

      - name: Syntax and behavior guard checks
        shell: bash
        run: |
          node --check app/main.min.js
          node --check app/main.no-updates.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/main.min.js').read_text(encoding='utf-8')
          checks = {
              'startup updater call removed': 'setupAutoUpdates();' not in s,
              'updater setup is no-op': 'function setupAutoUpdates(){return;}' in s,
              'deferred installer is no-op': 'function attemptAutoInstall(){return;}' in s,
              'update state disabled': "let updateState={'state':'disabled'};" in s,
              'manual install disabled': "ipcMain['handle']('update-install',()=>({'disabled':!![]}))" in s,
          }
          for label, ok in checks.items():
              print(f'{label}: {"OK" if ok else "FAIL"}')
              if not ok:
                  raise SystemExit(1)
          PY

      - name: Commit patched core and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/disable-updater-core.yml
          git add app/main.min.js
          git commit -m "fix: disable all KAIZEN version update checks"
          git push origin HEAD:main
