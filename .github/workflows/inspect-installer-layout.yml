name: Inspect installer layout
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current release installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          gh release download v1.5.2 -p "KAIZEN-Setup-1.5.2.exe" -D work
          Get-Item work/KAIZEN-Setup-1.5.2.exe | Format-List Name,Length
      - name: Inspect and extract NSIS installer
        shell: pwsh
        run: |
          7z l work/KAIZEN-Setup-1.5.2.exe | Out-File -Encoding utf8 work/7z-list.txt
          New-Item -ItemType Directory -Force work/extracted | Out-Null
          7z x -y work/KAIZEN-Setup-1.5.2.exe "-owork/extracted" | Out-Host
          Write-Host "=== TOP LEVEL ==="
          Get-ChildItem work/extracted -Force | Select-Object Name,Length,Mode | Format-Table -AutoSize
          Write-Host "=== FILES DEPTH <= 3 ==="
          Get-ChildItem work/extracted -Recurse -Force | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path work/extracted).Path.Length + 1)
            if (($rel -split '[\\/]').Count -le 3) { "$rel`t$($_.Length)" }
          } | Select-Object -First 500
          Write-Host "=== 7Z LIST TAIL ==="
          Get-Content work/7z-list.txt | Select-Object -Last 120
