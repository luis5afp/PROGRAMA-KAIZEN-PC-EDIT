name: Organize diagnostics 1.5.6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Organize diagnostic files
        run: python tools/organize_diagnostics_156.py
      - name: Validate JavaScript
        run: |
          node --check app/inspector/connectionCapture.js
          node --check app/inspector/profileChromeCapture.js
          node --check app/main.no-updates.js
          node -e "const p=require('./app/package.json'); if(p.version!=='1.5.6') process.exit(1)"
      - name: Commit organized diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/inspector/connectionCapture.js app/inspector/profileChromeCapture.js app/package.json
          git rm tools/organize_diagnostics_156.py .github/workflows/organize-diagnostics-1.5.6.yml
          git commit -m 'feat: split diagnostics into organized files'
          git push origin HEAD:main
