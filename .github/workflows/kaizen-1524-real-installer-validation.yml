name: KAIZEN 1.5.24 - Validar Setup Windows con 5 extensiones
on:
  push:
    branches:
      - staging/kaizzen-main-original-v2.5.6
    paths:
      - ".github/workflows/kaizen-1524-real-installer-validation.yml"
      - "scripts/build-windows-integrated.ps1"
      - "app/electron-builder.yml"
      - "app/scripts/verify-uploaded-original-extensions.js"
      - "runtime-resources/KAIZEN_EXTENSIONS/**"
      - "runtime-resources/extensionForSecurity/**"
      - "app/kaizen-diagnostics-1.5.24.js"
      - "app/kaizen-diagnostics-1.5.24.html"
      - "app/kaizen-diagnostics-renderer-1.5.24.js"
      - "app/kaizen-diagnostics-ui-1.5.24.js"
      - "app/main.member-test.js"
      - "app/preload.min.js"
      - "app/tests/release-1.5.24-diagnostics.js"
      - "scripts/diagnose-installed-kaizen.ps1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-validate-no-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Obtener codigo de la rama de extensiones reales
        uses: actions/checkout@v4
      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar los 3 perfiles originales y EX1/EX2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node app/scripts/verify-uploaded-original-extensions.js runtime-resources/KAIZEN_EXTENSIONS
          node app/scripts/verify-original-extensions.js runtime-resources/KAIZEN_EXTENSIONS/KAIZEN_EXTENSIONS
          node -e "require('./app/kaizen-original-extension-importer').validateFolder(process.argv[1])" runtime-resources/KAIZEN_EXTENSIONS/KAIZEN_EXTENSIONS
          node app/scripts/verify-security-extensions.js runtime-resources/extensionForSecurity
          node app/scripts/verify-legacy-core-resources.js runtime-resources/extensionForSecurity
          node app/tests/embedded-extension-integration-scenarios.js
          node --check app/main.member-test.js
          node --check app/kaizen-diagnostics-1.5.24.js
          node --check app/kaizen-diagnostics-renderer-1.5.24.js
          node --check app/kaizen-diagnostics-ui-1.5.24.js
          node --check app/preload.min.js
          node app/tests/release-1.5.24-diagnostics.js
      - name: Compilar instalador completo con 3 perfiles y EX1/EX2 (sin publicar)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & './scripts/build-windows-integrated.ps1' -ExtensionsSource 'runtime-resources/KAIZEN_EXTENSIONS'
      - name: Comprobar integridad de componentes incorporados al Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = 'dist/KAIZEN-PC-v1.5.24-win32-x64'
          $resources = Join-Path $root 'resources'
          node app/scripts/verify-original-extensions.js "$resources/KAIZEN_EXTENSIONS"
          node -e "require('./app/kaizen-original-extension-importer').validateFolder(process.argv[1])" "$resources/KAIZEN_EXTENSIONS"
          node app/scripts/verify-uploaded-original-extensions.js "$resources/KAIZEN_EXTENSIONS"
          node app/scripts/verify-security-extensions.js "$resources/extensionForSecurity"
          node app/scripts/verify-legacy-core-resources.js "$resources/extensionForSecurity"
          if (!(Test-Path "$root/KAIZEN_CHROMIUM/chrome-win64/chrome.exe")) { throw 'No se incorporo Chromium' }
          if (!(Test-Path "$root/KAIZEN-PC-v1.5.24.exe")) { throw 'No se incorporo el programa principal' }
          if (Test-Path "$resources/KAIZEN_EXTENSIONS/KAIZEN_EXTENSIONS") {
            throw 'Se conservo incorrectamente la carpeta anidada'
          }
          $setups = @(Get-ChildItem -Path 'dist/installer' -Filter '*.exe' -File)
          if ($setups.Count -ne 1) { throw "Se esperaban 1 Setup, encontrados $($setups.Count)" }
          if ($setups[0].Length -lt 100MB) { throw 'Setup sospechosamente pequeno o incompleto' }
          & './scripts/diagnose-installed-kaizen.ps1' -ProgramFolder $root
          if ($LASTEXITCODE -ne 0) { throw 'El prediagnostico de integridad del paquete fallo' }
          $digest = (Get-FileHash $setups[0].FullName -Algorithm SHA256).Hash
          Write-Host "PASS: Setup NSIS completo, 3 perfiles, EX1/EX2, Chromium. SHA256: $digest"
          Write-Host "Este control NO ejecuta los scripts de las extensiones en un navegador real."
      # No upload-artifact ni publicacion: codigo de extensiones con datos sensibles.
