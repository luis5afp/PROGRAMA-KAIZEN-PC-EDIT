name: Build KAIZEN 1.5.17

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate corrected source
        shell: pwsh
        run: |
          node --check app/main.no-updates.js
          node --check app/main.min.js
          node --check app/preload.min.js
          node --check app/util.min.js
          node --check app/proxyServer.js
          node --check app/inspector/connectionCapture.js
          node --check app/inspector/profileChromeCapture.js
          node --check app/inspector/extensionSnapshot.js
          Get-Content app/app_view/dist/assets/index-DAX2BPbP.js -Raw | node --input-type=module --check

          node app/tests/family-reliability-scenarios.js
          node app/tests/sync-profile-preload-scenarios.js
          node app/tests/profile-open-fast-path-scenarios.js

          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.17') { throw "Expected 1.5.17, got $($pkg.version)" }
          if ($pkg.main -ne 'main.no-updates.js') { throw "Wrong entrypoint: $($pkg.main)" }

          $main = Get-Content app/main.min.js -Raw
          $preload = Get-Content app/preload.min.js -Raw
          $bundle = Get-Content app/app_view/dist/assets/index-DAX2BPbP.js -Raw
          $util = Get-Content app/util.min.js -Raw

          if (-not $main.Contains('function profileUpdateFromCatalog')) { throw 'Catalog version fast path missing' }
          if (-not $main.Contains('extra /getversion request skipped')) { throw 'Catalog fast-path marker missing' }
          if (-not $main.Contains('prefetch-profile-extensions')) { throw 'Extension prefetch IPC missing' }
          if (-not $main.Contains('_0xserverVersionToMark')) { throw 'Server profile version marker missing' }
          if (-not $main.Contains('synchronized profile version')) { throw 'Applied profile-version persistence missing' }
          if (-not $main.Contains('_0xrelayReadyPromise')) { throw 'Proxy relay overlap optimization missing' }
          if (-not $preload.Contains('prefetchExtensions')) { throw 'Prefetch preload bridge missing' }
          if (-not $bundle.Contains('electron.prefetchExtensions({profiles:ue,token:k}).catch(()=>{})')) { throw 'Renderer extension warmup missing' }
          if (-not $util.Contains('return ok > 0')) { throw 'Cookie import success result missing' }

          if (-not $main.Contains('extension-sessions-PLAINTEXT.json')) { throw 'LAB session export missing' }
          if (-not $main.Contains('UNIVERSITY LAB / TEST DATA ONLY')) { throw 'LAB warning missing' }
          if (-not $main.Contains('openBrowserGuarded')) { throw 'Duplicate browser launch guard missing' }
          if (-not $main.Contains('sessionRefreshPromise')) { throw 'Session refresh lock missing' }
          if (-not $main.Contains('remembered-2fa.json')) { throw 'Remembered 2FA storage missing' }

          Write-Host 'KAIZEN 1.5.17 source validation OK'

      - name: Download and unpack 1.5.16 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          gh release download v1.5.16 -p 'KAIZEN-Setup-1.5.16.exe' -D work
          New-Item -ItemType Directory -Force work/nsis | Out-Null
          7z x -y work/KAIZEN-Setup-1.5.16.exe '-owork/nsis' | Out-Host
          if (-not (Test-Path 'work/nsis/$PLUGINSDIR/app-64.7z')) { throw 'Base app-64.7z not found' }
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          7z x -y 'work/nsis/$PLUGINSDIR/app-64.7z' '-owork/runtime' | Out-Host
          if (-not (Test-Path 'work/runtime/KAIZEN.exe')) { throw 'KAIZEN.exe missing from base runtime' }
          if (-not (Test-Path 'work/runtime/resources/app')) { throw 'resources/app missing from base runtime' }

      - name: Inject KAIZEN 1.5.17 app
        shell: pwsh
        run: |
          Remove-Item 'work/runtime/resources/app' -Recurse -Force
          New-Item -ItemType Directory -Force 'work/runtime/resources/app' | Out-Null
          Copy-Item 'app/*' 'work/runtime/resources/app/' -Recurse -Force
          if (Test-Path 'runtime-resources') {
            Copy-Item 'runtime-resources/*' 'work/runtime/resources/' -Recurse -Force
          }

          $pkg = Get-Content 'work/runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.17') { throw 'Injected app has wrong version' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Injected app has wrong entrypoint' }

      - name: Prepare electron-builder wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builder | Out-Null
          @'
          {
            "name": "kaizen",
            "version": "1.5.17",
            "description": "KAIZEN PC custom laboratory build",
            "author": "YERSON",
            "license": "MIT"
          }
          '@ | Set-Content builder/package.json -Encoding utf8

          @'
          appId: com.electron.kaizen
          productName: KAIZEN
          electronVersion: 35.0.0
          directories:
            output: ../work/out
          win:
            target:
              - target: nsis
                arch:
                  - x64
            signAndEditExecutable: false
          nsis:
            oneClick: false
            perMachine: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            installerIcon: ../app/assets/installer.ico
            uninstallerIcon: ../app/assets/uninstaller.ico
            artifactName: KAIZEN-Setup-${version}.${ext}
          '@ | Set-Content builder/electron-builder.yml -Encoding utf8

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Push-Location builder
          npm install --no-audit --no-fund --save-dev electron-builder@26.15.7
          npx electron-builder --prepackaged '../work/runtime' --win nsis --x64 --config electron-builder.yml --publish never
          Pop-Location
          if (-not (Test-Path 'work/out/KAIZEN-Setup-1.5.17.exe')) { throw 'Expected installer was not produced' }

      - name: Verify generated installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/verify-nsis | Out-Null
          7z x -y 'work/out/KAIZEN-Setup-1.5.17.exe' '-owork/verify-nsis' | Out-Host
          if (-not (Test-Path 'work/verify-nsis/$PLUGINSDIR/app-64.7z')) { throw 'Generated NSIS payload missing app-64.7z' }

          New-Item -ItemType Directory -Force work/verify-runtime | Out-Null
          7z x -y 'work/verify-nsis/$PLUGINSDIR/app-64.7z' '-owork/verify-runtime' | Out-Host
          $root = 'work/verify-runtime/resources/app'

          $pkg = Get-Content "$root/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.17') { throw 'Packaged version verification failed' }

          node --check "$root/main.no-updates.js"
          node --check "$root/main.min.js"
          node --check "$root/preload.min.js"
          node --check "$root/util.min.js"
          node --check "$root/proxyServer.js"
          node --check "$root/inspector/connectionCapture.js"
          node --check "$root/inspector/profileChromeCapture.js"
          node --check "$root/inspector/extensionSnapshot.js"
          Get-Content "$root/app_view/dist/assets/index-DAX2BPbP.js" -Raw | node --input-type=module --check

          Push-Location $root
          node tests/family-reliability-scenarios.js
          node tests/sync-profile-preload-scenarios.js
          node tests/profile-open-fast-path-scenarios.js
          Pop-Location

          $main = Get-Content "$root/main.min.js" -Raw
          $preload = Get-Content "$root/preload.min.js" -Raw
          $bundle = Get-Content "$root/app_view/dist/assets/index-DAX2BPbP.js" -Raw
          $util = Get-Content "$root/util.min.js" -Raw

          if (-not $main.Contains('function profileUpdateFromCatalog')) { throw 'Packaged catalog fast path missing' }
          if (-not $main.Contains('prefetch-profile-extensions')) { throw 'Packaged extension prefetch missing' }
          if (-not $main.Contains('synchronized profile version')) { throw 'Packaged profile-version persistence missing' }
          if (-not $main.Contains('_0xrelayReadyPromise')) { throw 'Packaged relay overlap optimization missing' }
          if (-not $preload.Contains('prefetchExtensions')) { throw 'Packaged prefetch bridge missing' }
          if (-not $bundle.Contains('electron.prefetchExtensions({profiles:ue,token:k}).catch(()=>{})')) { throw 'Packaged renderer warmup missing' }
          if (-not $util.Contains('return ok > 0')) { throw 'Packaged cookie import result missing' }

          if (-not $main.Contains('extension-sessions-PLAINTEXT.json')) { throw 'Packaged LAB export missing' }
          if (-not $main.Contains('openBrowserGuarded')) { throw 'Packaged duplicate launch guard missing' }

          Write-Host 'KAIZEN 1.5.17 installer payload verification OK'

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'work/out/KAIZEN-Setup-1.5.17.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KAIZEN-Setup-1.5.17.exe" | Set-Content 'work/out/KAIZEN-Setup-1.5.17.exe.sha256' -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Publish KAIZEN 1.5.17 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v1.5.17 2>$null) { throw 'Release v1.5.17 already exists' }
          gh release create v1.5.17 `
            'work/out/KAIZEN-Setup-1.5.17.exe' `
            'work/out/KAIZEN-Setup-1.5.17.exe.sha256' `
            --target main `
            --title 'KAIZEN 1.5.17' `
            --notes 'KAIZEN PC 1.5.17 reduces the delay before opening profiles. It uses profileVersion already delivered by the catalog instead of an extra /getversion request when available, warms assigned managed extensions in the background, overlaps proxy-relay startup with profile preparation, and records the synchronized server profile version only after synchronized cookies were successfully applied. The first open can still download required profile or extension data; subsequent opens should reuse the local state. Existing LAB session export, diagnostics, session refresh, 2FA, proxy safety, duplicate launch protection and sync listener fixes remain enabled.'

      - name: Remove one-shot build workflow
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/build-kaizen-1.5.17.yml'
          git commit -m 'build: remove KAIZEN 1.5.17 one-shot workflow'
          git push origin HEAD:main
