name: Upgrade passive conexion capture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-connection-capture.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand passive capture coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/inspector/connectionCapture.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace('format: "KAIZZEN_CONNECTION_V1"', 'format: "KAIZZEN_CONNECTION_V2"')

          old = '''    await fsp.appendFile(path.join(dir, "conexion.ndjson"), `${JSON.stringify(row)}\\n`, "utf8")'''
          new = '''    const line = `${JSON.stringify(row)}\\n`\n    await Promise.all([\n      fsp.appendFile(path.join(dir, "conexion"), line, "utf8"),\n      fsp.appendFile(path.join(dir, "conexion.ndjson"), line, "utf8"),\n    ])'''
          if old not in s:
              raise SystemExit('append anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''const textMime = mime => /^(text\\/)|json|javascript|xml|x-www-form-urlencoded|graphql/i.test(String(mime || ""))'''
          helper = '''const rawResponseHead = res => {\n  try {\n    const status = `HTTP/${String(res?.httpVersion || "")} ${Number(res?.statusCode || 0)} ${String(res?.statusMessage || "")}`.trimEnd()\n    const raw = Array.isArray(res?.rawHeaders) ? res.rawHeaders : []\n    const lines = [status]\n    for (let i = 0; i < raw.length; i += 2) lines.push(`${String(raw[i] ?? "")}: ${String(raw[i + 1] ?? "")}`)\n    return `${lines.join("\\r\\n")}\\r\\n\\r\\n`\n  } catch { return "" }\n}\nconst textMime = mime => /^(text\\/)|json|javascript|xml|x-www-form-urlencoded|graphql/i.test(String(mime || ""))'''
          if anchor not in s:
              raise SystemExit('helper anchor not found')
          s = s.replace(anchor, helper, 1)

          old = '''      const base = { type: "REQUEST", connectionId, source: "electron-main-node", direction: "client-to-server", method: String(req.method || "GET").toUpperCase(), url, headers: hs }'''
          new = '''      const base = {\n        type: "REQUEST", connectionId, source: "electron-main-node", direction: "client-to-server",\n        method: String(req.method || "GET").toUpperCase(), url, headers: hs,\n        rawRequestHead: typeof req._header === "string" ? req._header : "",\n        captureLevel: "application-plaintext-after-TLS",\n      }'''
          if old not in s:
              raise SystemExit('node request anchor not found')
          s = s.replace(old, new, 1)

          old = '''        statusText: String(res.statusMessage || ""), headers: hs,\n        rawHeaders: Array.isArray(res.rawHeaders) ? res.rawHeaders.map(String) : [], mimeType: mime, ...meta,'''
          new = '''        statusText: String(res.statusMessage || ""), headers: hs,\n        httpVersion: String(res.httpVersion || ""),\n        rawHeaders: Array.isArray(res.rawHeaders) ? res.rawHeaders.map(String) : [],\n        rawResponseHead: rawResponseHead(res),\n        mimeType: mime, captureLevel: "application-plaintext-after-TLS", ...meta,'''
          if old not in s:
              raise SystemExit('node response anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const reqs = new Map(), resps = new Map()'''
          new = '''  const reqs = new Map(), resps = new Map(), sockets = new Map()'''
          if old not in s:
              raise SystemExit('maps anchor not found')
          s = s.replace(old, new, 1)

          old = '''          const row = { type: "REQUEST", connectionId, requestId, source: "electron-renderer-cdp", direction: "client-to-server", method: String(r.method || "GET").toUpperCase(), url: String(r.url), headers: headers(r.headers), resourceType: String(p?.type || ""), hasPostData: Boolean(r.hasPostData) }'''
          new = '''          const row = {\n            type: "REQUEST", connectionId, requestId, source: "electron-renderer-cdp", direction: "client-to-server",\n            method: String(r.method || "GET").toUpperCase(), url: String(r.url), headers: headers(r.headers),\n            resourceType: String(p?.type || ""), hasPostData: Boolean(r.hasPostData),\n            postDataEntries: Array.isArray(r.postDataEntries) ? r.postDataEntries : null,\n            documentURL: String(p?.documentURL || ""), initiator: p?.initiator || null,\n            timestamp: p?.timestamp ?? null, wallTime: p?.wallTime ?? null,\n            mixedContentType: String(r.mixedContentType || ""), referrerPolicy: String(r.referrerPolicy || ""),\n            captureLevel: "application-plaintext-after-TLS",\n          }'''
          if old not in s:
              raise SystemExit('renderer request anchor not found')
          s = s.replace(old, new, 1)

          old = '''          resps.set(requestId, { type: "RESPONSE", connectionId: base?.connectionId || id("renderer"), requestId, source: "electron-renderer-cdp", direction: "server-to-client", method: base?.method || "", url: String(r.url), status: Number(r.status || 0), statusText: String(r.statusText || ""), headers: headers(r.headers), mimeType: String(r.mimeType || ""), protocol: String(r.protocol || ""), remoteIPAddress: String(r.remoteIPAddress || ""), remotePort: Number(r.remotePort || 0), fromDiskCache: Boolean(r.fromDiskCache), fromServiceWorker: Boolean(r.fromServiceWorker), resourceType: String(p?.type || "") })'''
          new = '''          resps.set(requestId, {\n            type: "RESPONSE", connectionId: base?.connectionId || id("renderer"), requestId,\n            source: "electron-renderer-cdp", direction: "server-to-client", method: base?.method || "",\n            url: String(r.url), status: Number(r.status || 0), statusText: String(r.statusText || ""),\n            headers: headers(r.headers), mimeType: String(r.mimeType || ""), protocol: String(r.protocol || ""),\n            remoteIPAddress: String(r.remoteIPAddress || ""), remotePort: Number(r.remotePort || 0),\n            fromDiskCache: Boolean(r.fromDiskCache), fromServiceWorker: Boolean(r.fromServiceWorker),\n            resourceType: String(p?.type || ""), timing: r.timing || null, securityDetails: r.securityDetails || null,\n            securityState: String(r.securityState || ""), encodedDataLength: Number(r.encodedDataLength || 0),\n            timestamp: p?.timestamp ?? null, captureLevel: "application-plaintext-after-TLS",\n          })'''
          if old not in s:
              raise SystemExit('renderer response anchor not found')
          s = s.replace(old, new, 1)

          marker = '''        if (method === "Network.loadingFailed") {'''
          websocket = '''        if (method === "Network.webSocketCreated") {\n          if (!isBackend(p?.url)) return\n          sockets.set(requestId, { connectionId: id("websocket"), requestId, url: String(p?.url || "") })\n          enqueue({ type: "WEBSOCKET_CREATED", ...sockets.get(requestId), source: "electron-renderer-cdp", direction: "bidirectional", initiator: p?.initiator || null, captureLevel: "application-plaintext-after-TLS" })\n          return\n        }\n        if (method === "Network.webSocketWillSendHandshakeRequest") {\n          const ws = sockets.get(requestId); if (!ws) return\n          enqueue({ type: "WEBSOCKET_HANDSHAKE_REQUEST", ...ws, source: "electron-renderer-cdp", direction: "client-to-server", headers: headers(p?.request?.headers), requestTime: p?.request?.requestTime ?? null, wallTime: p?.wallTime ?? null })\n          return\n        }\n        if (method === "Network.webSocketHandshakeResponseReceived") {\n          const ws = sockets.get(requestId); if (!ws) return\n          enqueue({ type: "WEBSOCKET_HANDSHAKE_RESPONSE", ...ws, source: "electron-renderer-cdp", direction: "server-to-client", status: Number(p?.response?.status || 0), statusText: String(p?.response?.statusText || ""), headers: headers(p?.response?.headers), headersText: String(p?.response?.headersText || "") })\n          return\n        }\n        if (method === "Network.webSocketFrameSent" || method === "Network.webSocketFrameReceived") {\n          const ws = sockets.get(requestId); if (!ws) return\n          const frame = p?.response || {}\n          const binary = Number(frame.opcode) === 2\n          const payload = String(frame.payloadData || "")\n          const body = binary ? Buffer.from(payload, "base64") : Buffer.from(payload, "utf8")\n          enqueue({ type: method.endsWith("Sent") ? "WEBSOCKET_FRAME_SENT" : "WEBSOCKET_FRAME_RECEIVED", ...ws, source: "electron-renderer-cdp", direction: method.endsWith("Sent") ? "client-to-server" : "server-to-client", opcode: Number(frame.opcode || 0), mask: Boolean(frame.mask), captureLevel: "application-plaintext-after-TLS" }, body, { mimeType: binary ? "application/octet-stream" : "text/plain", encoding: binary ? "decoded-from-cdp-base64" : "utf8", text: !binary })\n          return\n        }\n        if (method === "Network.webSocketClosed" || method === "Network.webSocketFrameError") {\n          const ws = sockets.get(requestId); if (!ws) return\n          enqueue({ type: method === "Network.webSocketClosed" ? "WEBSOCKET_CLOSED" : "WEBSOCKET_FRAME_ERROR", ...ws, source: "electron-renderer-cdp", direction: "local", timestamp: p?.timestamp ?? null, errorMessage: String(p?.errorMessage || "") })\n          if (method === "Network.webSocketClosed") sockets.delete(requestId)\n          return\n        }\n        if (method === "Network.eventSourceMessageReceived") {\n          const base = resps.get(requestId) || reqs.get(requestId)\n          if (!base) return\n          enqueue({ type: "EVENTSOURCE_MESSAGE", connectionId: base.connectionId, requestId, source: "electron-renderer-cdp", direction: "server-to-client", url: base.url, eventName: String(p?.eventName || ""), eventId: String(p?.eventId || ""), timestamp: p?.timestamp ?? null, captureLevel: "application-plaintext-after-TLS" }, Buffer.from(String(p?.data || ""), "utf8"), { mimeType: "text/event-stream", encoding: "utf8", text: true })\n          return\n        }\n        if (method === "Network.loadingFailed") {'''
          if marker not in s:
              raise SystemExit('websocket insertion anchor not found')
          s = s.replace(marker, websocket, 1)

          old = '''    wc.once("destroyed", () => { reqs.clear(); resps.clear() })'''
          new = '''    wc.once("destroyed", () => { reqs.clear(); resps.clear(); sockets.clear() })'''
          if old not in s:
              raise SystemExit('cleanup anchor not found')
          s = s.replace(old, new, 1)

          old = '''  enqueue({ type: "INSPECTOR_START", source: "launcher", direction: "local", policy: "passive-no-network-modification", output: "conexion.ndjson" })'''
          new = '''  enqueue({ type: "INSPECTOR_START", source: "launcher", direction: "local", policy: "passive-no-network-modification", captureLevel: "application-plaintext-after-TLS", redaction: "none", encryptionAtRest: "none", outputs: ["conexion", "conexion.ndjson", "bodies/*"] })'''
          if old not in s:
              raise SystemExit('start row anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('connection capture upgraded')
          PY

      - name: Validate syntax and passive-only guards
        shell: bash
        run: |
          node --check app/inspector/connectionCapture.js
          node --check app/main.no-updates.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/inspector/connectionCapture.js').read_text(encoding='utf-8')
          checks = {
              'canonical conexion file': 'path.join(dir, "conexion")' in s,
              'no redaction': 'redaction: "none"' in s,
              'node raw request head': 'rawRequestHead' in s,
              'node raw response head': 'rawResponseHead' in s,
              'websocket received': 'WEBSOCKET_FRAME_RECEIVED' in s,
              'eventsource': 'EVENTSOURCE_MESSAGE' in s,
              'no Fetch interception': 'Fetch.enable' not in s,
          }
          for label, ok in checks.items():
              print(f'{label}: {"OK" if ok else "FAIL"}')
              if not ok: raise SystemExit(1)
          PY

      - name: Commit upgraded inspector and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/upgrade-connection-capture.yml
          git add app/inspector/connectionCapture.js
          git commit -m "feat: capture complete passive lab connection data"
          git push origin HEAD:main
