name: KAIZEN regression checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check app/main.no-updates.js
          node --check app/main.kaizen-1.5.24.js
          node --check app/kaizen-diagnostics-1.5.24.js
          node --check app/kaizen-diagnostics-preload-1.5.24.js
          node --check app/kaizen-diagnostics-renderer-1.5.24.js
          node --check app/main.min.js
          node --check app/preload.min.js
          node --check app/util.min.js
          node --check app/proxyServer.js
          node --check app/inspector/connectionCapture.js
          node --check app/inspector/profileChromeCapture.js
          node --check app/inspector/extensionSnapshot.js
          Get-Content app/app_view/dist/assets/index-DAX2BPbP.js -Raw | node --input-type=module --check

      - name: Run KAIZEN regression scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node app/tests/family-reliability-scenarios.js
          node app/tests/sync-profile-preload-scenarios.js
          node app/tests/profile-open-fast-path-scenarios.js
          node app/tests/guest-local-update-scenarios.js
          node app/tests/release-1.5.24-diagnostics.js
          node app/tests/embedded-extension-integration-scenarios.js
          node app/tests/r3-catalog-open-scenarios.js
          node app/tests/catalog-autofill-diagnostic-scenarios.js
          node app/tests/verify-original-extensions-scenarios.js
          node app/tests/original-extension-importer-scenarios.js
          node app/scripts/verify-uploaded-original-extensions.js runtime-resources/KAIZEN_EXTENSIONS
          node app/tests/verify-security-extensions-scenarios.js
          $errors = @()
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/build-windows-integrated.ps1').Path,
            [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { throw ("Errores de sintaxis en el script de instalacion: " + ($errors -join '; ')) }

      - name: Validate release metadata
        shell: pwsh
        run: |
          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "Unexpected KAIZEN version $($pkg.version)" }
          if ($pkg.main -ne 'main.kaizen-1.5.24.js') { throw "Unexpected main entrypoint $($pkg.main)" }
