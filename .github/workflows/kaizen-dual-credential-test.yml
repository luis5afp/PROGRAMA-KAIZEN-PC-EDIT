name: KAIZEN dual credential Windows test

on:
  pull_request:
    paths:
      - "app/dual-access-test/**"
      - "app/tests/dual-access-test-scenarios.js"
      - ".github/workflows/kaizen-dual-credential-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate test JavaScript
        shell: pwsh
        run: |
          node --check app/dual-access-test/service.js
          node --check app/dual-access-test/main.js
          node --check app/dual-access-test/preload.js
          node --check app/dual-access-test/renderer.js
          node app/tests/dual-access-test-scenarios.js

      - name: Install original signed client dependencies
        working-directory: app
        shell: pwsh
        run: npm install --omit=dev --no-audit --no-fund

      - name: Configure isolated Electron test entrypoint
        shell: pwsh
        run: |
          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          $pkg.main = "dual-access-test/main.js"
          $pkg.name = "kaizen-dual-access-test"
          $pkg | Add-Member -NotePropertyName productName -NotePropertyValue "KAIZEN-DOBLE-ACCESO" -Force
          $pkg | ConvertTo-Json -Depth 10 | Set-Content app/package.json -Encoding utf8

      - name: Package Windows portable test
        shell: pwsh
        run: |
          npx --yes @electron/packager@18.3.6 ./app "KAIZEN-DOBLE-ACCESO" --platform=win32 --arch=x64 --electron-version=36.0.0 --out=dist --overwrite --icon=app/assets/app.ico --asar
          if (!(Test-Path "dist/KAIZEN-DOBLE-ACCESO-win32-x64/KAIZEN-DOBLE-ACCESO.exe")) { throw "Missing portable test executable" }

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRUEBA-DOBLE-ACCESO-Windows-x64
          path: dist/KAIZEN-DOBLE-ACCESO-win32-x64/
          retention-days: 7
          if-no-files-found: error
