name: KAIZEN PC 1.5.39 - Chromium sin Chrome for Testing
on:
  pull_request:
    paths:
      - "app/**"
      - "runtime-resources/KAIZEN_EXTENSIONS/**"
      - "scripts/build-windows-integrated.ps1"
      - ".github/workflows/kaizen-1528-release.yml"
      - "scripts/diagnose-installed-kaizen.ps1"
      - "app/main.member-test.js"
      - "app/main.kaizen-1.5.24.js"
      - "app/tests/original-extension-integration-scenarios.js"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaizen-1528-release.yml"
      - "scripts/diagnose-installed-kaizen.ps1"
      - "scripts/build-windows-integrated.ps1"
      - "app/main.member-test.js"
      - "app/main.kaizen-1.5.24.js"
      - "app/kaizen-original-extensions-host.js"
      - "app/tests/original-extension-integration-scenarios.js"
      - "app/package.json"
      - "app/electron-builder.yml"
      - "docs/RELEASE-NOTES-v1.5.39.md"
permissions:
  contents: write
concurrency:
  group: kaizen-1539-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'luis5afp/PROGRAMA-KAIZEN-PC-EDIT'
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar version y archivos originales
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          if(git ls-remote --tags origin refs/tags/v1.5.39) { throw 'v1.5.39 ya existe; no sobrescribir Release' }
          $pkg=(Get-Content app/package.json -Raw | ConvertFrom-Json)
          if($pkg.version -ne '1.5.39') { throw "Version de aplicacion incorrecta: $($pkg.version)" }
          node app/tests/guest-local-update-scenarios.js
          node app/tests/release-1.5.24-diagnostics.js
          node app/tests/embedded-extension-integration-scenarios.js
          node app/tests/r3-catalog-open-scenarios.js
          node app/tests/catalog-autofill-diagnostic-scenarios.js
          node app/tests/authorized-field-aliases-scenarios.js
          node app/tests/catalog-diagnostic-v2-runtime.js
          node app/tests/verify-original-extensions-scenarios.js
          node app/tests/original-extension-importer-scenarios.js
          node app/tests/original-extension-integration-scenarios.js
          $productionMain=Get-Content 'app/main.kaizen-1.5.24.js' -Raw
          $memberMain=Get-Content 'app/main.member-test.js' -Raw
          if(([regex]::Matches($productionMain,'ipcMain\.handle\("kaizen-original-extension-open"')).Count -ne 1 -or
             ([regex]::Matches($memberMain,'ipcMain\.handle\("kaizen-original-extension-open"')).Count -ne 0) {
            throw 'El IPC de apertura Chromium no tiene un único propietario.'
          }
          node app/scripts/verify-uploaded-original-extensions.js runtime-resources/KAIZEN_EXTENSIONS
          node app/scripts/verify-original-extensions.js runtime-resources/KAIZEN_EXTENSIONS/KAIZEN_EXTENSIONS
          node app/scripts/verify-security-extensions.js runtime-resources/extensionForSecurity
          node app/scripts/verify-legacy-core-resources.js runtime-resources/extensionForSecurity
          if(!(Test-Path 'docs/RELEASE-NOTES-v1.5.39.md')) { throw 'Faltan notas de version 1.5.39' }
      - name: Compilar instalador Windows con los cinco paquetes reales
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          $tokens=$null; $parseErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/diagnose-installed-kaizen.ps1').Path,
            [ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          & './scripts/build-windows-integrated.ps1' -ExtensionsSource 'runtime-resources/KAIZEN_EXTENSIONS'
          $root='dist/KAIZEN-PC-v1.5.39-win32-x64'
          & './scripts/diagnose-installed-kaizen.ps1' -ProgramFolder $root
          if($LASTEXITCODE -ne 0) { throw 'Integridad de recursos empaquetados invalida' }
          node app/scripts/verify-uploaded-original-extensions.js "$root/resources/KAIZEN_EXTENSIONS"
      - name: Instalar Setup y verificar EX1, EX2 y los tres perfiles
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          $setup=@(Get-ChildItem 'dist/installer' -Filter '*.exe' -File)
          if($setup.Count -ne 1 -or $setup[0].Length -lt 100MB) { throw 'Setup incompleto' }
          $p=Start-Process -FilePath $setup[0].FullName -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0) { throw "No se pudo instalar el Setup: $($p.ExitCode)" }
          $programs=Join-Path $env:LOCALAPPDATA 'Programs'
          $installed=@(Get-ChildItem $programs -Recurse -Filter 'KAIZEN-PC-v1.5.39.exe' -File -ErrorAction SilentlyContinue)
          if($installed.Count -ne 1) { throw 'EXE instalado no encontrado o duplicado' }
          $folder=Split-Path -Parent $installed[0].FullName
          & './scripts/diagnose-installed-kaizen.ps1' -ProgramFolder $folder
          if($LASTEXITCODE -ne 0) { throw 'Integridad del programa instalado invalida' }
          node app/scripts/verify-uploaded-original-extensions.js (Join-Path $folder 'resources/KAIZEN_EXTENSIONS')
          node app/scripts/verify-security-extensions.js (Join-Path $folder 'resources/extensionForSecurity')
          node app/scripts/verify-legacy-core-resources.js (Join-Path $folder 'resources/extensionForSecurity')
          $browser=Join-Path $folder 'KAIZEN_CHROMIUM/chrome-win/chrome.exe'
          $versionOutput=(& $browser --version 2>&1 | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $versionOutput -notmatch 'Chromium' -or $versionOutput -match 'Chrome for Testing') {
            throw "El navegador instalado no es Chromium sin marca: $versionOutput"
          }
          Write-Host "Navegador instalado y ejecutable: $versionOutput"
          $smokeProfile=Join-Path $env:TEMP ("kaizen-chromium-smoke-"+[guid]::NewGuid().ToString('N'))
          try {
            & $browser '--headless=new' '--disable-gpu' '--no-first-run' "--user-data-dir=$smokeProfile" '--dump-dom' 'about:blank' | Out-Null
            if($LASTEXITCODE -ne 0) { throw 'Chromium no pudo abrir una página headless de prueba.' }
            Write-Host 'Chromium headless startup smoke test: PASS'
          } finally {
            if(Test-Path -LiteralPath $smokeProfile) { Remove-Item -LiteralPath $smokeProfile -Recurse -Force }
          }
      - name: Crear SHA256 y confirmar el instalador definitivo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=@(Get-ChildItem 'dist/installer' -Filter '*.exe' -File)
          if($setup.Count -ne 1) { throw 'No existe Setup unico' }
          $digest=(Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest *$($setup[0].Name)" | Set-Content -LiteralPath ($setup[0].FullName+'.sha256') -Encoding ascii
          "SETUP=$($setup[0].FullName)" >> $env:GITHUB_ENV
          "SHA=$($setup[0].FullName).sha256" >> $env:GITHUB_ENV
          Write-Host "SHA-256 Setup 1.5.39: $digest"
      - name: Conservar instalador verificado como descarga de Actions
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PC-v1.5.39-Setup-Windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publicar KAIZEN PC 1.5.39 solo al integrar en main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          $sha=(git rev-parse HEAD).Trim()
          & gh release create v1.5.39 "$env:SETUP" "$env:SHA" --repo "$env:GITHUB_REPOSITORY" --target "$sha" --title 'KAIZEN PC 1.5.39 - Chromium sin Chrome for Testing' --notes-file docs/RELEASE-NOTES-v1.5.39.md --latest
          if($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la version 1.5.39' }
