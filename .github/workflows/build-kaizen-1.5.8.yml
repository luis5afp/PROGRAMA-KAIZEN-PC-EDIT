name: Build KAIZEN 1.5.8
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source
        shell: pwsh
        run: |
          node --check app/main.no-updates.js
          node --check app/preload.min.js
          node --check app/inspector/connectionCapture.js
          node --check app/inspector/profileChromeCapture.js
          node --check app/inspector/extensionSnapshot.js
          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.8') { throw "Expected 1.5.8, got $($pkg.version)" }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Expected main.no-updates.js entrypoint' }
          $launcher = Get-Content app/main.no-updates.js -Raw
          $ext = Get-Content app/inspector/extensionSnapshot.js -Raw
          $profile = Get-Content app/inspector/profileChromeCapture.js -Raw
          if (-not $launcher.Contains('startExtensionSnapshotCapture')) { throw 'Extension snapshot launcher missing' }
          if (-not $ext.Contains('KAIZZEN_EXTENSION_LIBRARY_V1')) { throw 'Extension library format missing' }
          if (-not $ext.Contains('KAIZZEN_PROFILE_EXTENSIONS_V1')) { throw 'Per-profile extension index missing' }
          if (-not $ext.Contains('original-zip-byte-for-byte')) { throw 'Original ZIP preservation missing' }
          if (-not $ext.Contains('unpacked-folder-exact-file-bytes')) { throw 'Folder preservation missing' }
          if (-not $ext.Contains('15000')) { throw 'Delayed snapshot safeguard missing' }
          if (-not $ext.Contains('KAIZEN-managed extensions only')) { throw 'Managed-extension scope marker missing' }
          if ($profile.Contains('Fetch.enable')) { throw 'Active Fetch interception is not allowed' }
          if (-not $profile.Contains('Network.enable')) { throw 'Passive Network capture missing' }
          if (-not (Get-Content app/preload.min.js -Raw).Contains('kaizen-diagnostics-folder-button')) { throw 'Diagnostics button missing' }
          Write-Host 'Source validation OK'

      - name: Download and unpack 1.5.7 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          gh release download v1.5.7 -p 'KAIZEN-Setup-1.5.7.exe' -D work
          New-Item -ItemType Directory -Force work/nsis | Out-Null
          7z x -y work/KAIZEN-Setup-1.5.7.exe '-owork/nsis' | Out-Host
          if (-not (Test-Path 'work/nsis/$PLUGINSDIR/app-64.7z')) { throw 'Base app-64.7z not found' }
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          7z x -y 'work/nsis/$PLUGINSDIR/app-64.7z' '-owork/runtime' | Out-Host
          if (-not (Test-Path 'work/runtime/KAIZEN.exe')) { throw 'KAIZEN.exe missing from base runtime' }
          if (-not (Test-Path 'work/runtime/resources/app')) { throw 'resources/app missing from base runtime' }

      - name: Inject current KAIZEN app and runtime resources
        shell: pwsh
        run: |
          Remove-Item 'work/runtime/resources/app' -Recurse -Force
          New-Item -ItemType Directory -Force 'work/runtime/resources/app' | Out-Null
          Copy-Item 'app/*' 'work/runtime/resources/app/' -Recurse -Force
          if (Test-Path 'runtime-resources') { Copy-Item 'runtime-resources/*' 'work/runtime/resources/' -Recurse -Force }
          $pkg = Get-Content 'work/runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.8') { throw 'Injected app has wrong version' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Injected app has wrong entrypoint' }

      - name: Prepare electron-builder wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builder | Out-Null
          @'
          {
            "name": "kaizen",
            "version": "1.5.8",
            "description": "KAIZEN PC custom laboratory build",
            "author": "YERSON",
            "license": "MIT"
          }
          '@ | Set-Content builder/package.json -Encoding utf8
          @'
          appId: com.electron.kaizen
          productName: KAIZEN
          electronVersion: 35.0.0
          directories:
            output: ../work/out
          win:
            target:
              - target: nsis
                arch:
                  - x64
            signAndEditExecutable: false
          nsis:
            oneClick: false
            perMachine: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            installerIcon: ../app/assets/installer.ico
            uninstallerIcon: ../app/assets/uninstaller.ico
            artifactName: KAIZEN-Setup-${version}.${ext}
          '@ | Set-Content builder/electron-builder.yml -Encoding utf8

      - name: Build NSIS installer from prepackaged runtime
        shell: pwsh
        run: |
          Push-Location builder
          npm install --no-audit --no-fund --save-dev electron-builder@26.15.7
          npx electron-builder --prepackaged '../work/runtime' --win nsis --x64 --config electron-builder.yml --publish never
          Pop-Location
          if (-not (Test-Path 'work/out/KAIZEN-Setup-1.5.8.exe')) { throw 'Expected installer was not produced' }

      - name: Verify generated installer contains extension preservation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/verify-nsis | Out-Null
          7z x -y 'work/out/KAIZEN-Setup-1.5.8.exe' '-owork/verify-nsis' | Out-Host
          if (-not (Test-Path 'work/verify-nsis/$PLUGINSDIR/app-64.7z')) { throw 'Generated NSIS payload missing app-64.7z' }
          New-Item -ItemType Directory -Force work/verify-runtime | Out-Null
          7z x -y 'work/verify-nsis/$PLUGINSDIR/app-64.7z' '-owork/verify-runtime' | Out-Host
          $root = 'work/verify-runtime/resources/app'
          $pkg = Get-Content "$root/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.8') { throw 'Packaged version verification failed' }
          $launcher = Get-Content "$root/main.no-updates.js" -Raw
          $ext = Get-Content "$root/inspector/extensionSnapshot.js" -Raw
          $profile = Get-Content "$root/inspector/profileChromeCapture.js" -Raw
          if (-not $launcher.Contains('startExtensionSnapshotCapture')) { throw 'Packaged extension snapshot launcher missing' }
          if (-not $ext.Contains('original-zip-byte-for-byte')) { throw 'Packaged original ZIP preservation missing' }
          if (-not $ext.Contains('unpacked-folder-exact-file-bytes')) { throw 'Packaged folder preservation missing' }
          if (-not $ext.Contains('extensions.json')) { throw 'Packaged extension index missing' }
          if ($profile.Contains('Fetch.enable')) { throw 'Packaged inspector unexpectedly contains Fetch.enable' }
          if (-not (Get-Content "$root/preload.min.js" -Raw).Contains('kaizen-diagnostics-folder-button')) { throw 'Packaged diagnostics button missing' }
          Write-Host 'Installer payload verification OK'

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'work/out/KAIZEN-Setup-1.5.8.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KAIZEN-Setup-1.5.8.exe" | Set-Content 'work/out/KAIZEN-Setup-1.5.8.exe.sha256' -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/build-kaizen-1.5.8.yml'
          git commit -m 'build: remove KAIZEN 1.5.8 one-shot workflow'
          git push origin HEAD:main

      - name: Publish KAIZEN 1.5.8 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v1.5.8 2>$null) { throw 'Release v1.5.8 already exists' }
          gh release create v1.5.8 `
            'work/out/KAIZEN-Setup-1.5.8.exe' `
            'work/out/KAIZEN-Setup-1.5.8.exe.sha256' `
            --target main `
            --title 'KAIZEN 1.5.8' `
            --notes 'KAIZEN PC 1.5.8 laboratory build. Adds reusable diagnostics preservation for KAIZEN-managed extensions. Original downloaded ZIP packages are copied byte-for-byte when available; folder-only extensions are copied with exact file bytes and per-file SHA-256. A per-profile extensions.json index links detected loaded extensions to the preserved library. Snapshot work is delayed 15 seconds after Chrome launch and remains local-only so it does not modify browser or server traffic. Existing categorized diagnostics, timeline indexes, Diagnostics folder button and disabled automatic updates remain enabled.'
