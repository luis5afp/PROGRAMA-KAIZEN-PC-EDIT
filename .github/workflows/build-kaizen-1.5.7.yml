name: Build KAIZEN 1.5.7
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add lightweight reconstructable timelines
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json

          files = [
              Path('app/inspector/connectionCapture.js'),
              Path('app/inspector/profileChromeCapture.js'),
          ]

          helper = '''function nextTimelineSeq(dir) {\n  const next = (timelineSeqByDir.get(dir) || 0) + 1\n  timelineSeqByDir.set(dir, next)\n  return next\n}\nfunction makeTimelineEntry(row, file, timelineSeq) {\n  return {\n    format: "KAIZZEN_TIMELINE_V1",\n    seq: timelineSeq,\n    capturedAt: row.capturedAt || now(),\n    type: String(row.type || "EVENT"),\n    id: row.id || null,\n    connectionId: row.connectionId || null,\n    requestId: row.requestId || null,\n    source: row.source || null,\n    direction: row.direction || null,\n    method: row.method || null,\n    url: row.url || null,\n    status: row.status ?? row.statusCode ?? null,\n    protocol: row.protocol || null,\n    resourceType: row.resourceType || null,\n    captureMode: row.captureMode || null,\n    error: row.error || row.bodyError || row.postDataError || null,\n    file,\n    bodyFile: row.bodyFile || null,\n    bodyBytes: Number.isFinite(row.bodyBytes) ? row.bodyBytes : null,\n    bodySha256: row.bodySha256 || null,\n    profileName: row.profileName || null,\n    profileUniqueName: row.profileUniqueName || null,\n    debugPort: row.debugPort ?? null,\n  }\n}\n\n'''

          for p in files:
              s = p.read_text(encoding='utf-8')
              if 'const timelineSeqByDir = new Map()' not in s:
                  s = s.replace('const writeQueues = new Map()\n', 'const writeQueues = new Map()\nconst timelineSeqByDir = new Map()\n', 1)
              if 'function makeTimelineEntry(row, file, timelineSeq)' not in s:
                  marker = 'const headers = h => {'
                  if marker not in s:
                      raise SystemExit(f'headers marker missing in {p}')
                  s = s.replace(marker, helper + marker, 1)

              old = '''  const line = `${JSON.stringify(row)}\\n`\n  await fsp.appendFile(path.join(dir, eventFile(row)), line, "utf8")'''
              new = '''  const file = eventFile(row)\n  const timelineSeq = nextTimelineSeq(dir)\n  row.timelineSeq = timelineSeq\n  const line = `${JSON.stringify(row)}\\n`\n  await fsp.appendFile(path.join(dir, file), line, "utf8")\n  const timeline = makeTimelineEntry(row, file, timelineSeq)\n  await fsp.appendFile(path.join(dir, "timeline.ndjson"), `${JSON.stringify(timeline)}\\n`, "utf8")'''
              if old not in s:
                  # Main inspector has its append block nested inside try with four-space indentation.
                  old = '''    const line = `${JSON.stringify(row)}\\n`\n    await fsp.appendFile(path.join(dir, eventFile(row)), line, "utf8")'''
                  new = '''    const file = eventFile(row)\n    const timelineSeq = nextTimelineSeq(dir)\n    row.timelineSeq = timelineSeq\n    const line = `${JSON.stringify(row)}\\n`\n    await fsp.appendFile(path.join(dir, file), line, "utf8")\n    const timeline = makeTimelineEntry(row, file, timelineSeq)\n    await fsp.appendFile(path.join(dir, "timeline.ndjson"), `${JSON.stringify(timeline)}\\n`, "utf8")'''
              if old not in s:
                  raise SystemExit(f'categorized append block missing in {p}')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          pkgp = Path('app/package.json')
          pkg = json.loads(pkgp.read_text(encoding='utf-8'))
          pkg['version'] = '1.5.7'
          pkgp.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          '@ | Set-Content patch_timeline.py -Encoding utf8
          python patch_timeline.py
          Remove-Item patch_timeline.py -Force

      - name: Validate source
        shell: pwsh
        run: |
          node --check app/main.no-updates.js
          node --check app/preload.min.js
          node --check app/inspector/connectionCapture.js
          node --check app/inspector/profileChromeCapture.js
          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.7') { throw "Expected 1.5.7, got $($pkg.version)" }
          $main = Get-Content app/inspector/connectionCapture.js -Raw
          $profile = Get-Content app/inspector/profileChromeCapture.js -Raw
          foreach ($text in @($main, $profile)) {
            if (-not $text.Contains('KAIZZEN_TIMELINE_V1')) { throw 'Timeline format missing' }
            if (-not $text.Contains('timeline.ndjson')) { throw 'Timeline output missing' }
            if (-not $text.Contains('timelineSeq')) { throw 'Timeline sequence missing' }
            if ($text.Contains('Fetch.enable')) { throw 'Active Fetch interception is not allowed' }
          }
          if (-not (Get-Content app/preload.min.js -Raw).Contains('kaizen-diagnostics-folder-button')) { throw 'Diagnostics button missing' }
          Write-Host 'Source validation OK'

      - name: Download and unpack 1.5.6 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          gh release download v1.5.6 -p 'KAIZEN-Setup-1.5.6.exe' -D work
          New-Item -ItemType Directory -Force work/nsis | Out-Null
          7z x -y work/KAIZEN-Setup-1.5.6.exe '-owork/nsis' | Out-Host
          if (-not (Test-Path 'work/nsis/$PLUGINSDIR/app-64.7z')) { throw 'Base app-64.7z not found' }
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          7z x -y 'work/nsis/$PLUGINSDIR/app-64.7z' '-owork/runtime' | Out-Host
          if (-not (Test-Path 'work/runtime/KAIZEN.exe')) { throw 'KAIZEN.exe missing from base runtime' }
          if (-not (Test-Path 'work/runtime/resources/app')) { throw 'resources/app missing from base runtime' }

      - name: Inject current KAIZEN app and runtime resources
        shell: pwsh
        run: |
          Remove-Item 'work/runtime/resources/app' -Recurse -Force
          New-Item -ItemType Directory -Force 'work/runtime/resources/app' | Out-Null
          Copy-Item 'app/*' 'work/runtime/resources/app/' -Recurse -Force
          if (Test-Path 'runtime-resources') { Copy-Item 'runtime-resources/*' 'work/runtime/resources/' -Recurse -Force }
          $pkg = Get-Content 'work/runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.7') { throw 'Injected app has wrong version' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Injected app has wrong entrypoint' }

      - name: Prepare electron-builder wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builder | Out-Null
          @'
          {
            "name": "kaizen",
            "version": "1.5.7",
            "description": "KAIZEN PC custom laboratory build",
            "author": "YERSON",
            "license": "MIT"
          }
          '@ | Set-Content builder/package.json -Encoding utf8
          @'
          appId: com.electron.kaizen
          productName: KAIZEN
          electronVersion: 35.0.0
          directories:
            output: ../work/out
          win:
            target:
              - target: nsis
                arch:
                  - x64
            signAndEditExecutable: false
          nsis:
            oneClick: false
            perMachine: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            installerIcon: ../app/assets/installer.ico
            uninstallerIcon: ../app/assets/uninstaller.ico
            artifactName: KAIZEN-Setup-${version}.${ext}
          '@ | Set-Content builder/electron-builder.yml -Encoding utf8

      - name: Build NSIS installer from prepackaged runtime
        shell: pwsh
        run: |
          Push-Location builder
          npm install --no-audit --no-fund --save-dev electron-builder@26.15.7
          npx electron-builder --prepackaged '../work/runtime' --win nsis --x64 --config electron-builder.yml --publish never
          Pop-Location
          if (-not (Test-Path 'work/out/KAIZEN-Setup-1.5.7.exe')) { throw 'Expected installer was not produced' }

      - name: Verify generated installer contains timeline diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/verify-nsis | Out-Null
          7z x -y 'work/out/KAIZEN-Setup-1.5.7.exe' '-owork/verify-nsis' | Out-Host
          if (-not (Test-Path 'work/verify-nsis/$PLUGINSDIR/app-64.7z')) { throw 'Generated NSIS payload missing app-64.7z' }
          New-Item -ItemType Directory -Force work/verify-runtime | Out-Null
          7z x -y 'work/verify-nsis/$PLUGINSDIR/app-64.7z' '-owork/verify-runtime' | Out-Host
          $root = 'work/verify-runtime/resources/app'
          $pkg = Get-Content "$root/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.7') { throw 'Packaged version verification failed' }
          $main = Get-Content "$root/inspector/connectionCapture.js" -Raw
          $profile = Get-Content "$root/inspector/profileChromeCapture.js" -Raw
          foreach ($text in @($main, $profile)) {
            if (-not $text.Contains('KAIZZEN_TIMELINE_V1')) { throw 'Packaged timeline missing' }
            if (-not $text.Contains('timeline.ndjson')) { throw 'Packaged timeline file missing' }
            if (-not $text.Contains('timelineSeq')) { throw 'Packaged timeline sequence missing' }
            if ($text.Contains('Fetch.enable')) { throw 'Packaged inspector unexpectedly contains Fetch.enable' }
          }
          if (-not (Get-Content "$root/preload.min.js" -Raw).Contains('kaizen-diagnostics-folder-button')) { throw 'Packaged diagnostics button missing' }
          Write-Host 'Installer payload verification OK'

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'work/out/KAIZEN-Setup-1.5.7.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KAIZEN-Setup-1.5.7.exe" | Set-Content 'work/out/KAIZEN-Setup-1.5.7.exe.sha256' -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Commit source and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/inspector/connectionCapture.js app/inspector/profileChromeCapture.js app/package.json
          git rm '.github/workflows/build-kaizen-1.5.7.yml'
          git commit -m 'feat: add reconstructable diagnostic timelines'
          git push origin HEAD:main

      - name: Publish KAIZEN 1.5.7 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v1.5.7 2>$null) { throw 'Release v1.5.7 already exists' }
          gh release create v1.5.7 `
            'work/out/KAIZEN-Setup-1.5.7.exe' `
            'work/out/KAIZEN-Setup-1.5.7.exe.sha256' `
            --target main `
            --title 'KAIZEN 1.5.7' `
            --notes 'KAIZEN PC 1.5.7 laboratory build. Adds lightweight timeline.ndjson indexes globally and per Chrome profile so separated diagnostic files can be reconstructed chronologically without duplicating bodies or changing network flow. Existing categorized diagnostics, passive per-profile capture, Diagnostics folder button and disabled automatic updates remain enabled.'
