name: Build KAIZEN 1.5.23

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate corrected source
        shell: pwsh
        run: |
          node --check app/main.no-updates.js
          node --check app/main.min.js
          node --check app/preload.min.js
          node --check app/util.min.js
          node --check app/proxyServer.js
          node --check app/inspector/connectionCapture.js
          node --check app/inspector/profileChromeCapture.js
          node --check app/inspector/extensionSnapshot.js
          Get-Content app/app_view/dist/assets/index-DAX2BPbP.js -Raw | node --input-type=module --check

          node app/tests/family-reliability-scenarios.js
          node app/tests/sync-profile-preload-scenarios.js
          node app/tests/profile-open-fast-path-scenarios.js
          node app/tests/guest-local-update-scenarios.js

          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.23') { throw "Expected 1.5.23, got $($pkg.version)" }
          if ($pkg.main -ne 'main.no-updates.js') { throw "Wrong entrypoint: $($pkg.main)" }

          $main = Get-Content app/main.min.js -Raw
          $preload = Get-Content app/preload.min.js -Raw
          $noUpdates = Get-Content app/main.no-updates.js -Raw

          if (-not $preload.Contains('function installGuestProfilesButton()')) { throw 'Guest button missing' }
          if (-not $preload.Contains("ipcRenderer.invoke('guest-local-refresh'")) { throw 'Guest local refresh UI missing' }
          if (-not $preload.Contains("ipcRenderer.invoke('guest-local-folder-open')")) { throw 'Guest local folder UI missing' }
          if (-not $main.Contains("ipcMain.handle('guest-local-refresh'")) { throw 'Guest local refresh IPC missing' }
          if (-not $main.Contains("ipcMain.handle('guest-local-folder-open'")) { throw 'Guest local folder IPC missing' }
          if (-not $main.Contains("C:\\KAIZEN-PERFILES")) { throw 'Preferred local profile folder missing' }
          if (-not $main.Contains('.kaizen-backup-')) { throw 'Local profile rollback backup missing' }
          if (-not $main.Contains("ipcMain.handle('guest-local-import-bundle'")) { throw 'resources.zip import IPC missing' }
          if (-not $main.Contains('guestDiscoverZipPackages')) { throw 'resources.zip discovery missing' }
          if (-not $main.Contains('guestApplyLocalUpdates')) { throw 'bulk local update application missing' }
          if (-not $main.Contains('ensurePersistentKaizenStorage')) { throw 'persistent profile storage missing' }
          if (-not $main.Contains('guestRecoverAccidentalResourcesProfile')) { throw 'resources recovery missing' }
          if (-not $main.Contains('guestFindNestedDataRoots')) { throw 'nested resources discovery missing' }
          if (-not $main.Contains('guestExtractAndRecoverResourcesZip')) { throw 'resources.zip fallback recovery missing' }
          if (-not $main.Contains("ipcMain.handle('guest-local-import-folder'")) { throw 'folder import IPC missing' }
          if (-not $main.Contains('guestLooksLikeChromeProfileDir')) { throw 'Chrome profile folder validation missing' }
          if (-not $main.Contains('guestCopyProfileDirAtomic')) { throw 'atomic folder import missing' }
          if (-not $main.Contains('guestCopyDataRoots')) { throw 'bulk folder import missing' }
          if (-not $main.Contains("String(_0xzipName||'').toLowerCase()==='resources.zip'")) { throw 'resources.zip fake-profile guard missing' }
          if (-not $main.Contains('KAIZEN-Logistica')) { throw 'persistent logistics root missing' }
          if (-not $preload.Contains("ipcRenderer.invoke('guest-local-import-bundle')")) { throw 'resources.zip import UI missing' }
          if (-not $preload.Contains('📦 Importar resources.zip')) { throw 'resources.zip button missing' }
          if (-not $preload.Contains('📂 Importar carpeta')) { throw 'folder import button missing' }
          if (-not $preload.Contains("ipcRenderer.invoke('guest-local-import-folder')")) { throw 'folder import UI bridge missing' }
          if (-not $preload.Contains('🔄 Actualizar todo')) { throw 'bulk update button missing' }
          if (-not $main.Contains('without server authentication')) { throw 'Local-only guest launch marker missing' }
          if (-not $noUpdates.Contains('autoUpdater.checkForUpdates = async () => null')) { throw 'Application updater must remain disabled' }
          if (-not $noUpdates.Contains('autoUpdater.downloadUpdate = async () => []')) { throw 'Application updater download must remain disabled' }

          Write-Host 'KAIZEN 1.5.23 source validation OK'

      - name: Download and unpack 1.5.22 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          gh release download v1.5.22 -p 'KAIZEN-Setup-1.5.22.exe' -D work
          New-Item -ItemType Directory -Force work/nsis | Out-Null
          7z x -y work/KAIZEN-Setup-1.5.22.exe '-owork/nsis' | Out-Host
          if (-not (Test-Path 'work/nsis/$PLUGINSDIR/app-64.7z')) { throw 'Base app-64.7z not found' }
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          7z x -y 'work/nsis/$PLUGINSDIR/app-64.7z' '-owork/runtime' | Out-Host
          if (-not (Test-Path 'work/runtime/KAIZEN.exe')) { throw 'KAIZEN.exe missing from base runtime' }
          if (-not (Test-Path 'work/runtime/resources/app')) { throw 'resources/app missing from base runtime' }

      - name: Inject KAIZEN 1.5.23 app
        shell: pwsh
        run: |
          Remove-Item 'work/runtime/resources/app' -Recurse -Force
          New-Item -ItemType Directory -Force 'work/runtime/resources/app' | Out-Null
          Copy-Item 'app/*' 'work/runtime/resources/app/' -Recurse -Force
          if (Test-Path 'runtime-resources') {
            Copy-Item 'runtime-resources/*' 'work/runtime/resources/' -Recurse -Force
          }

          $pkg = Get-Content 'work/runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.23') { throw 'Injected app has wrong version' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Injected app has wrong entrypoint' }

      - name: Prepare electron-builder wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builder | Out-Null
          @'
          {
            "name": "kaizen",
            "version": "1.5.23",
            "description": "KAIZEN PC custom logistics build",
            "author": "YERSON",
            "license": "MIT"
          }
          '@ | Set-Content builder/package.json -Encoding utf8

          @'
          appId: com.electron.kaizen
          productName: KAIZEN
          electronVersion: 35.0.0
          directories:
            output: ../work/out
          win:
            target:
              - target: nsis
                arch:
                  - x64
            signAndEditExecutable: false
          nsis:
            oneClick: false
            perMachine: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            installerIcon: ../app/assets/installer.ico
            uninstallerIcon: ../app/assets/uninstaller.ico
            artifactName: KAIZEN-Setup-${version}.${ext}
          '@ | Set-Content builder/electron-builder.yml -Encoding utf8

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Push-Location builder
          npm install --no-audit --no-fund --save-dev electron-builder@26.15.7
          npx electron-builder --prepackaged '../work/runtime' --win nsis --x64 --config electron-builder.yml --publish never
          Pop-Location
          if (-not (Test-Path 'work/out/KAIZEN-Setup-1.5.23.exe')) { throw 'Expected installer was not produced' }

      - name: Verify generated installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/verify-nsis | Out-Null
          7z x -y 'work/out/KAIZEN-Setup-1.5.23.exe' '-owork/verify-nsis' | Out-Host
          if (-not (Test-Path 'work/verify-nsis/$PLUGINSDIR/app-64.7z')) { throw 'Generated NSIS payload missing app-64.7z' }

          New-Item -ItemType Directory -Force work/verify-runtime | Out-Null
          7z x -y 'work/verify-nsis/$PLUGINSDIR/app-64.7z' '-owork/verify-runtime' | Out-Host
          $root = 'work/verify-runtime/resources/app'

          $pkg = Get-Content "$root/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.23') { throw 'Packaged version verification failed' }

          node --check "$root/main.no-updates.js"
          node --check "$root/main.min.js"
          node --check "$root/preload.min.js"
          node --check "$root/util.min.js"
          node --check "$root/proxyServer.js"

          $main = Get-Content "$root/main.min.js" -Raw
          $preload = Get-Content "$root/preload.min.js" -Raw
          if (-not $preload.Contains('function installGuestProfilesButton()')) { throw 'Packaged guest button missing' }
          if (-not $preload.Contains("ipcRenderer.invoke('guest-local-refresh'")) { throw 'Packaged guest local refresh missing' }
          if (-not $main.Contains("ipcMain.handle('guest-local-refresh'")) { throw 'Packaged guest local refresh IPC missing' }
          if (-not $main.Contains("C:\\KAIZEN-PERFILES")) { throw 'Packaged local profile source missing' }
          if (-not $main.Contains('.kaizen-backup-')) { throw 'Packaged rollback protection missing' }
          if (-not $main.Contains("ipcMain.handle('guest-local-import-bundle'")) { throw 'Packaged resources.zip import IPC missing' }
          if (-not $main.Contains('guestApplyLocalUpdates')) { throw 'Packaged bulk update support missing' }
          if (-not $main.Contains('ensurePersistentKaizenStorage')) { throw 'Packaged persistent profile storage missing' }
          if (-not $main.Contains('guestRecoverAccidentalResourcesProfile')) { throw 'Packaged resources recovery missing' }
          if (-not $main.Contains('guestFindNestedDataRoots')) { throw 'Packaged nested resources discovery missing' }
          if (-not $main.Contains('guestExtractAndRecoverResourcesZip')) { throw 'Packaged resources.zip fallback recovery missing' }
          if (-not $main.Contains("ipcMain.handle('guest-local-import-folder'")) { throw 'Packaged folder import IPC missing' }
          if (-not $main.Contains('guestCopyProfileDirAtomic')) { throw 'Packaged folder import support missing' }
          if (-not $preload.Contains('📦 Importar resources.zip')) { throw 'Packaged resources.zip import button missing' }
          if (-not $preload.Contains('📂 Importar carpeta')) { throw 'Packaged folder import button missing' }
          if (-not $preload.Contains('🔄 Actualizar todo')) { throw 'Packaged bulk update button missing' }

          Write-Host 'KAIZEN 1.5.23 installer payload verification OK'

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'work/out/KAIZEN-Setup-1.5.23.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KAIZEN-Setup-1.5.23.exe" | Set-Content 'work/out/KAIZEN-Setup-1.5.23.exe.sha256' -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Publish KAIZEN 1.5.23 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v1.5.23 2>$null) { throw 'Release v1.5.23 already exists' }
          gh release create v1.5.23 `
            'work/out/KAIZEN-Setup-1.5.23.exe' `
            'work/out/KAIZEN-Setup-1.5.23.exe.sha256' `
            --target main `
            --title 'KAIZEN 1.5.23' `
            --notes 'KAIZEN PC 1.5.23 añade importación directa de carpetas para perfiles locales. Permite seleccionar browserProfilesData, resources, una carpeta superior que los contenga o un perfil individual; copia los perfiles al almacenamiento persistente sin borrar la fuente, con respaldo y reemplazo atómico. También conserva la importación de resources.zip, el modo Invitado sin login/token y el actualizador de la aplicación desactivado.'

      - name: Remove one-shot build workflow
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/build-kaizen-1.5.23.yml'
          git commit -m 'build: remove KAIZEN 1.5.23 one-shot workflow'
          git push origin HEAD:main
