name: Build KAIZEN 1.5.5
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate custom source
        shell: pwsh
        run: |
          node --check app/main.no-updates.js
          node --check app/preload.min.js
          node --check app/inspector/connectionCapture.js
          node --check app/inspector/profileChromeCapture.js
          $pkg = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.5') { throw "Expected app version 1.5.5, got $($pkg.version)" }
          if ($pkg.main -ne 'main.no-updates.js') { throw "Unexpected main entry: $($pkg.main)" }
          $launcher = Get-Content app/main.no-updates.js -Raw
          $preload = Get-Content app/preload.min.js -Raw
          if (-not $launcher.Contains('diagnostics-open-folder')) { throw 'Diagnostics folder IPC handler missing' }
          if (-not $launcher.Contains('KAIZEN-Inspector')) { throw 'Diagnostics directory target missing' }
          if (-not $preload.Contains('kaizen-diagnostics-folder-button')) { throw 'Diagnostics UI button missing' }
          if (-not $preload.Contains('📁 Diagnóstico')) { throw 'Diagnostics button label missing' }
          $profileCapture = Get-Content app/inspector/profileChromeCapture.js -Raw
          if (-not $profileCapture.Contains('Network.enable')) { throw 'Profile Network observer missing' }
          if ($profileCapture.Contains('Fetch.enable')) { throw 'Active Fetch interception is not allowed' }
          Write-Host 'Source validation OK'

      - name: Download and unpack 1.5.4 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          gh release download v1.5.4 -p 'KAIZEN-Setup-1.5.4.exe' -D work
          New-Item -ItemType Directory -Force work/nsis | Out-Null
          7z x -y work/KAIZEN-Setup-1.5.4.exe '-owork/nsis' | Out-Host
          if (-not (Test-Path 'work/nsis/$PLUGINSDIR/app-64.7z')) { throw 'Base app-64.7z not found' }
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          7z x -y 'work/nsis/$PLUGINSDIR/app-64.7z' '-owork/runtime' | Out-Host
          if (-not (Test-Path 'work/runtime/KAIZEN.exe')) { throw 'KAIZEN.exe missing from base runtime' }
          if (-not (Test-Path 'work/runtime/resources/app')) { throw 'resources/app missing from base runtime' }
          Write-Host 'Base runtime extracted successfully'

      - name: Inject current KAIZEN app and runtime resources
        shell: pwsh
        run: |
          Remove-Item 'work/runtime/resources/app' -Recurse -Force
          New-Item -ItemType Directory -Force 'work/runtime/resources/app' | Out-Null
          Copy-Item 'app/*' 'work/runtime/resources/app/' -Recurse -Force
          if (Test-Path 'runtime-resources') {
            Copy-Item 'runtime-resources/*' 'work/runtime/resources/' -Recurse -Force
          }
          $pkg = Get-Content 'work/runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.5') { throw 'Injected app has wrong version' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Injected app has wrong entrypoint' }
          Write-Host 'Current app injected into Electron runtime'

      - name: Prepare electron-builder wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builder | Out-Null
          @'
          {
            "name": "kaizen",
            "version": "1.5.5",
            "description": "KAIZEN PC custom laboratory build",
            "author": "YERSON",
            "license": "MIT"
          }
          '@ | Set-Content builder/package.json -Encoding utf8
          @'
          appId: com.electron.kaizen
          productName: KAIZEN
          electronVersion: 35.0.0
          directories:
            output: ../work/out
          win:
            target:
              - target: nsis
                arch:
                  - x64
            signAndEditExecutable: false
          nsis:
            oneClick: false
            perMachine: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            installerIcon: ../app/assets/installer.ico
            uninstallerIcon: ../app/assets/uninstaller.ico
            artifactName: KAIZEN-Setup-${version}.${ext}
          '@ | Set-Content builder/electron-builder.yml -Encoding utf8

      - name: Build NSIS installer from prepackaged runtime
        shell: pwsh
        run: |
          Push-Location builder
          npm install --no-audit --no-fund --save-dev electron-builder@26.15.7
          npx electron-builder --prepackaged '../work/runtime' --win nsis --x64 --config electron-builder.yml --publish never
          Pop-Location
          Get-ChildItem work/out | Select-Object Name,Length | Format-Table -AutoSize
          if (-not (Test-Path 'work/out/KAIZEN-Setup-1.5.5.exe')) { throw 'Expected installer was not produced' }

      - name: Verify generated installer contains diagnostics button
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/verify-nsis | Out-Null
          7z x -y 'work/out/KAIZEN-Setup-1.5.5.exe' '-owork/verify-nsis' | Out-Host
          if (-not (Test-Path 'work/verify-nsis/$PLUGINSDIR/app-64.7z')) { throw 'Generated NSIS payload missing app-64.7z' }
          New-Item -ItemType Directory -Force work/verify-runtime | Out-Null
          7z x -y 'work/verify-nsis/$PLUGINSDIR/app-64.7z' '-owork/verify-runtime' | Out-Host
          $pkg = Get-Content 'work/verify-runtime/resources/app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.5') { throw 'Packaged version verification failed' }
          if ($pkg.main -ne 'main.no-updates.js') { throw 'Packaged entrypoint verification failed' }
          $launcher = Get-Content 'work/verify-runtime/resources/app/main.no-updates.js' -Raw
          $preload = Get-Content 'work/verify-runtime/resources/app/preload.min.js' -Raw
          if (-not $launcher.Contains('diagnostics-open-folder')) { throw 'Packaged diagnostics folder handler missing' }
          if (-not $preload.Contains('kaizen-diagnostics-folder-button')) { throw 'Packaged diagnostics button missing' }
          if (-not $preload.Contains('📁 Diagnóstico')) { throw 'Packaged diagnostics label missing' }
          $profileCapture = Get-Content 'work/verify-runtime/resources/app/inspector/profileChromeCapture.js' -Raw
          if ($profileCapture.Contains('Fetch.enable')) { throw 'Packaged inspector unexpectedly contains active Fetch interception' }
          Write-Host 'Installer payload verification OK'

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'work/out/KAIZEN-Setup-1.5.5.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KAIZEN-Setup-1.5.5.exe" | Set-Content 'work/out/KAIZEN-Setup-1.5.5.exe.sha256' -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Remove one-shot build workflow from main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/build-kaizen-1.5.5.yml'
          git commit -m 'chore: remove one-shot KAIZEN 1.5.5 build workflow'
          git push origin HEAD:main

      - name: Publish KAIZEN 1.5.5 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v1.5.5 2>$null) { throw 'Release v1.5.5 already exists' }
          gh release create v1.5.5 `
            'work/out/KAIZEN-Setup-1.5.5.exe' `
            'work/out/KAIZEN-Setup-1.5.5.exe.sha256' `
            --target main `
            --title 'KAIZEN 1.5.5' `
            --notes 'KAIZEN PC 1.5.5 laboratory build. Adds an in-app Diagnostics button that opens the local KAIZEN-Inspector/conexion folder in Windows Explorer. Existing passive per-profile diagnostics and disabled automatic updates remain unchanged.'
