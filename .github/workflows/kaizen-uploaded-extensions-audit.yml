name: KAIZEN 1.5.24 - Auditar extensiones originales subidas
on:
  push:
    branches:
      - staging/kaizzen-main-original-v2.5.6
    paths:
      - "runtime-resources/KAIZEN_EXTENSIONS/**"
      - "app/scripts/verify-uploaded-original-extensions.js"
      - "scripts/build-windows-integrated.ps1"
      - ".github/workflows/kaizen-uploaded-extensions-audit.yml"
permissions:
  contents: read
jobs:
  verify-original-upload:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar estructura, manifiestos y archivos obligatorios sin ejecutar extensiones
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --check app/scripts/verify-uploaded-original-extensions.js
          node app/scripts/verify-uploaded-original-extensions.js runtime-resources/KAIZEN_EXTENSIONS
          $source = 'runtime-resources/KAIZEN_EXTENSIONS/KAIZEN_EXTENSIONS'
          node app/scripts/verify-original-extensions.js $source
          node -e "require('./app/kaizen-original-extension-importer').validateFolder(process.argv[1])" $source
      - name: Validar sintaxis JavaScript de los originales (sin ejecutarlos)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = 'runtime-resources/KAIZEN_EXTENSIONS/KAIZEN_EXTENSIONS'
          foreach ($name in @('KAIZZEN_MAIN','KAIZZEN_GOOGLE','KAIZZEN_CUSTOM')) {
            $folder = Join-Path $root $name
            foreach ($js in @('backgroundScript.js','contentScript.js','idbUtil.js','storageInjector.js')) {
              node --check (Join-Path $folder $js)
            }
            Get-ChildItem -LiteralPath (Join-Path $folder 'assets') -Filter '*.js' -File | ForEach-Object {
              node --check $_.FullName
            }
          }
          $errors = @()
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/build-windows-integrated.ps1').Path,
            [ref]$null,[ref]$errors)
          if ($errors.Count -gt 0) { throw ('Errores PowerShell: ' + ($errors -join '; ')) }
      - name: Verificar integración simulada de botones Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node app/tests/embedded-extension-integration-scenarios.js
      # Sin subir ZIP, cookies, tokens ni artefactos de los scripts a Actions.
