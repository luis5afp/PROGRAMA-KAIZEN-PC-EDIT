name: Cleanup release reference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-release-reference.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove accidental source link from release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.5.2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "1.5.2" \
            --notes "KAIZEN 1.5.2"
