appId: org.kaizzen.kaizenpc
productName: KAIZEN-PC
electronVersion: 36.0.0
directories:
  output: ../dist/installer
publish:
  provider: github
  owner: luis5afp
  repo: PROGRAMA-KAIZEN-PC-EDIT
  private: false
win:
  icon: assets/app.ico
  target:
    - nsis
nsis:
  artifactName: KAIZEN-PC-v${version}-Setup-${arch}.${ext}
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
